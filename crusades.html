const canvas = (w, h) => Object.assign(document.createElement('canvas'), {width: w, height: h});
const SW = Math.round(GEO.W*SOFT.sc), SH = Math.round(GEO.H*SOFT.sc), OW = Math.round(GEO.W*SOFT.out), OH = Math.round(GEO.H*SOFT.out);
const cvA = canvas(SW, SH), cvB = canvas(SW, SH), cvO = canvas(OW, OH);
const xA = cvA.getContext('2d'), xB = cvB.getContext('2d', {willReadFrequently: true}), xO = cvO.getContext('2d');
const P2 = Object.fromEntries(BIDS.map(id => [id, new Path2D(B[id].d)]));
function softPass(fillFn){   // 清晰填色画到 A，模糊后画到 B，返回 B 的像素
  xA.setTransform(1,0,0,1,0,0); xA.clearRect(0, 0, SW, SH); xA.setTransform(SOFT.sc,0,0,SOFT.sc,0,0); fillFn(xA);
  xB.clearRect(0, 0, SW, SH); xB.filter = `blur(${SOFT.blur*SOFT.sc}px)`; xB.drawImage(cvA, 0, 0); xB.filter = 'none';
  return xB.getImageData(0, 0, SW, SH);
}
const landA = softPass(x => { x.fillStyle = '#fff'; for (const id of BIDS) x.fill(P2[id]); }).data.filter((v, i) => i % 4 === 3);
let softCur = 0, softSig = '', softT = 0, softBusy = false;
function softRender(){
  if (softBusy) return;
  const C = CH(), dim = blocksG.classed('dim'), hl = new Set(); if (dim) blkSel.each(function(id){ if (this.classList.contains('hl')) hl.add(id); });
  const sig = C.id + '|' + BIDS.map(id => assignMap[id] + (dim && !hl.has(id) ? '-' : '')).join(',');
  if (sig === softSig) return; softSig = sig;
  const img = softPass(x => { for (const id of BIDS) { const f = C.factions[assignMap[id]]; if (!f) continue; x.globalAlpha = dim && !hl.has(id) ? .22 : 1; x.fillStyle = f.color; x.fill(P2[id]); } x.globalAlpha = 1; }), d = img.data;
  for (let i = 0, j = 3; j < d.length; i++, j += 4) { const la = landA[i]; d[j] = la > 6 ? Math.min(255, d[j]*255/la) : 0; }

    setTimeout(() => { a.style('opacity', 1); softT = setTimeout(() => b.style('opacity', 0), 850); }, 40);
  });
}

function prepRoutes(S, full){

    if (path.empty()) return;
    const L = path.node().getTotalLength(), color = (C.routes.find(x => x.id === id)||{}).color || '#2f5f9e', r = {id, path, halo, lab, L, done: !!full, color, tok: null};
    if (!full) {
      path.style('animation','none').attr('marker-end', null).style('stroke-dasharray', `0 ${(L+10)*curK}`); halo.style('stroke-dasharray', `0 ${(L+10)*curK}`); lab.style('display','none');
      r.tok = routeG.append('g').attr('class','token').attr('display','none'); r.tok.append('circle').attr('class','halo').attr('r',13); r.tok.append('circle').attr('class','dot').attr('r',7).attr('fill', color);

// 行军一直走到下一条路线开始、或这一幕最后一句说完，不会线早早画完而话还没说完。
function routeWindow(b, r, k, n){
  const RA = b.S.routeAt || {}, at = RA[r.id], cue = i => b.cues[clamp(i, 0, b.cues.length-1)];
  if (at && b.cues.length) {
    const a = cue(at[0])[0], later = Object.values(RA).map(v => cue(v[0])[0]).filter(t => t > a + .5);
    const z = Math.max(cue(at[1])[1], later.length ? Math.min(...later) : b.cues[b.cues.length-1][1]);
    return [a/b.dur, z/b.dur];

  const n = P.rt.length; if (!n) return;
  P.rt.forEach((r, k) => {
    const [a, z] = routeWindow(b, r, k, n), pk = d3.easeSinInOut(clamp((p - a)/Math.max(.01, z - a), 0, 1));
    if (pk > 0) r.lab.style('display', null);
    if (pk >= 1) { if (!r.done) { r.done = true; r.path.style('animation', null).style('stroke-dasharray', null).attr('marker-end', 'url(#arrow)'); r.halo.style('stroke-dasharray', null); } }
    else {   // 路线的描边不随缩放变粗（non-scaling-stroke），虚线长度按屏幕像素算，所以要乘当前缩放，线头才和小旗子对齐
      r.done = false; const d = `${pk*r.L*curK} ${(r.L+10)*curK}`; r.path.style('stroke-dasharray', d).attr('marker-end', null); r.halo.style('stroke-dasharray', d); }
    if (r.tok) {
      if (pk > 0 && pk < 1) { const pt = r.path.node().getPointAtLength(pk*r.L); r.tok.attr('display', null).attr('transform', `translate(${pt.x},${pt.y}) scale(${1/curK})`); if (r.id === P.follow) P.tokenXY = [pt.x, pt.y]; }
      else r.tok.attr('display', 'none');
    }
  });
}
function followCam(dt, local){
  if (!P.follow || !P.tokenXY || local < .9) return;
  const w = wrapEl.clientWidth, h = wrapEl.clientHeight, T0 = d3.zoomTransform(svg.node()), k = viewTransform(curView()).k;
  if (!P.followT) { svg.interrupt(); P.followT = 1; }
  const a = 1 - Math.exp(-dt*2.6), tx = w/2 + (window.VIEW_SHIFT||0) - P.tokenXY[0]*k, ty = h/2 - P.tokenXY[1]*k;
  const T = d3.zoomIdentity.translate(T0.x + (tx-T0.x)*a, T0.y + (ty-T0.y)*a).scale(T0.k + (k-T0.k)*a);
  viewT = T; svg.call(zoom.transform, T);
}

/* ---- 战役镜头：每个阶段拉近到“动起来”的那一块 ---- */
function bFocus(pi){
  const b = BV.b, n = b.phases.length, w = wrapEl.clientWidth, h = wrapEl.clientHeight; let T = bFit();
  if (pi >= 1 && pi <= n) {
    const pts = []; for (const d of BV.U||[]) if (d.mv && d.mv.to) { pts.push(d.xy); if (d.prev) pts.push(bxyA(d.prev)); }
    for (const ev of b.phases[pi-1].events||[]) pts.push(bxy(ev.lon, ev.lat));
    if (pts.length >= 2) {
      const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]), minK = Math.max(w/BV.w, h/BV.h);
      const bw = Math.max(Math.max(...xs)-Math.min(...xs), BV.w*.1), bh = Math.max(Math.max(...ys)-Math.min(...ys), BV.h*.1);
      const k = clamp(Math.min(w/(bw*1.9), h/(bh*1.9)), minK, minK*3.6), cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
      T = d3.zoomIdentity.translate(clamp(w/2 - cx*k, w - BV.w*k, 0), clamp(h/2 - cy*k, h - BV.h*k, 0)).scale(k);
    }
  }
  BV.svg.transition().duration(1500).ease(d3.easeCubicInOut).call(bzoom.transform, T);
}

/* ---- 节拍切换 ---- */
function startBeat(i, resume){
  i = clamp(i, 0, beats.length-1); const b = beats[i]; P.bi = i; P.local = 0; P.cue = -1; P.flipped = false; P.followT = 0; P.tokenXY = null; P.ended = false;
  hidePtip(); P.busy = true;
  try {
    if (b.type === 'stage') {
      window.VIEW_SHIFT = (b.S.image && innerWidth > 860) ? 120 : 0;
      go(b.ci, b.si, {first:false});
      const before = b.S.map && b.S.map.before; if (before) paintMap(b.C, b.S, before.assign);
      prepRoutes(b.S, !resume); showFigure(b.S);
      if (!b.S.routes || !b.S.routes.length) prepRoutes(b.S, true);
      flashCard(`第 ${b.si+1} 幕 · ${b.when}`, b.title);
    } else {
      window.VIEW_SHIFT = 0; showFigure(null);
      if (BV.open && BV.b === b.b) { bGo(b.pi); } else { if (!(CH() === b.C && ST() === b.S)) go(b.ci, b.si, {keepView:true, instant:true}); openBattle(b.C, b.b, b.pi); }
      setTimeout(() => bFocus(b.pi), 80);
      if (b.pi === 0) flashCard(`战役详图 · ${b.b.when||''}`, b.b.name);
    }
  } finally { P.busy = false; }
  if (!resume) {   // 暂停时跳到某一节拍：显示这一节拍结束时的样子
    prepRoutes(b.type === 'stage' ? b.S : {routes: []}, true);
    if (b.type === 'stage') { const before = b.S.map && b.S.map.before; if (before) paintMap(b.C, b.S, b.S.map.assign); }
  }
  if (b.audio) { au.src = b.audio; au.playbackRate = P.rate; try { au.currentTime = 0; } catch(e){} } else { au.removeAttribute('src'); au.load(); }
  if (P.playing) playAudio();
  updateBar(); renderSub(-1);
}
function playAudio(){ const b = beats[P.bi]; if (b && b.audio) { const pr = au.play(); if (pr) pr.catch(() => { P.playing = false; syncUI(); toast('浏览器拦截了自动播放，请再点一次 ▶'); }); } }
function seekBeat(i, play){
  P.started = true; $('intro').hidden = true; P.playing = !!play; syncUI(); startBeat(i, !!play);
}

/* ---- 字幕、面板高亮 ---- */
function renderSub(idx){
  const b = beats[P.bi], c = b && b.cues[idx];
  if (c) { subSpan.textContent = c[2]; subSpan.classList.add('on'); } else subSpan.classList.remove('on');
  const box = $(b && b.type === 'battle' ? 'bs-body' : 's-body'); if (!box) return;
  const sn = box.querySelectorAll('.sn'); sn.forEach(el => { const j = +el.dataset.i; el.classList.toggle('cur', j === idx); el.classList.toggle('past', idx >= 0 && j < idx); });
  const cur = box.querySelector('.sn.cur');
  if (cur) {
    if (getComputedStyle(box).overflowY === 'visible') { const mc = document.querySelector('.mapcol').getBoundingClientRect().height; window.scrollTo({top: Math.max(0, cur.getBoundingClientRect().top + scrollY - mc - 70), behavior: 'smooth'}); }
    else box.scrollTo({top: Math.max(0, cur.offsetTop - box.clientHeight*.3), behavior: 'smooth'});
  }
}
function frame(ts){
  const dt = Math.min(.1, (ts - P.last)/1000); P.last = ts;
  const b = beats[P.bi];
  if (b && P.playing) {
    if (b.audio && !au.ended && au.readyState >= 2 && !au.paused) P.local = au.currentTime;
    else if (!b.audio || au.ended) P.local += dt*P.rate;
    const p = clamp(P.local/b.dur, 0, 1);
    let idx = -1; for (let k = 0; k < b.cues.length; k++) if (P.local >= b.cues[k][0] - .05) idx = k;
    if (idx >= 0 && P.local > b.cues[idx][1] + .5 && idx === b.cues.length-1) idx = -2;   // 最后一句念完后字幕淡出
    if (idx !== P.cue) { P.cue = idx; renderSub(idx < 0 ? -1 : idx); }
    if (b.type === 'stage') {
      updateRoutes(b, p); followCam(dt, P.local);
      const before = b.S.map && b.S.map.before;
      const fi = b.S.map && b.S.map.flipAt, fp = fi != null && b.cues[fi] ? b.cues[fi][0]/b.dur : .7;
      if (before && !P.flipped && p >= fp) { P.flipped = true; paintMap(b.C, b.S, b.S.map.assign); }
    }
    updateBar();
    if (P.local >= b.dur + b.gap) { if (P.bi < beats.length-1) startBeat(P.bi+1, true); else finish(); }
  }
}
function finish(){
  P.playing = false; P.ended = true; syncUI(); au.pause(); renderSub(-1);
  const C = CHAPTERS[beats[P.bi].ci]; $('in-title').textContent = '放映结束'; $('in-lead').textContent = '想再看一遍，或者点进度条上的任意一幕。'; $('in-meta').textContent = C.title;
  $('in-go').lastChild.textContent = '重新放映'; $('intro').hidden = false;
}

/* ---- 控制 ---- */
function play(){
  if (!P.started || P.ended) { seekBeat(P.ended ? 0 : P.bi < 0 ? 0 : P.bi, true); return; }
  P.playing = true; syncUI();
  const b = beats[P.bi];
  if (b && P.local < 0.05) startBeat(P.bi, true); else playAudio();
}
function pause(){ if (!P.playing) return; P.playing = false; au.pause(); syncUI(); }
function toggle(){ P.playing ? pause() : play(); }
function jumpScene(dir){
  const stages = beats.map((b,i) => b.type === 'stage' ? i : -1).filter(i => i >= 0), cur = P.bi < 0 ? 0 : P.bi;
  let curS = Math.max(...stages.filter(i => i <= cur));
  if (dir < 0) { const t = beats[cur]; const target = (cur > curS || P.local > 3) ? curS : stages[Math.max(0, stages.indexOf(curS)-1)]; seekBeat(target, P.playing || !P.started); }
  else { const nx = stages.find(i => i > cur); if (nx != null) seekBeat(nx, P.playing || !P.started); }
}
$('pb-play').onclick = toggle; $('pb-prev').onclick = () => jumpScene(-1); $('pb-next').onclick = () => jumpScene(1);
$('pb-rate').onclick = () => { const L = [1, 1.25, 1.5, 2, .8], k = (L.indexOf(P.rate)+1) % L.length; P.rate = L[k]; au.playbackRate = P.rate; store(CFG.prefix+'-rate', P.rate); syncUI(); };
$('pb-cc').onclick = () => { P.cc = !P.cc; store(CFG.prefix+'-cc', P.cc ? '1' : '0'); syncUI(); };
$('pb-vol').onclick = () => { P.muted = !P.muted; au.muted = P.muted; store(CFG.prefix+'-muted', P.muted ? '1' : '0'); syncUI(); };
$('in-go').onclick = () => play();
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === ' ' && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); e.stopImmediatePropagation(); toggle(); }
  else if (e.key === 'ArrowRight') { e.stopImmediatePropagation(); jumpScene(1); }
  else if (e.key === 'ArrowLeft') { e.stopImmediatePropagation(); jumpScene(-1); }
}, true);
au.addEventListener('ended', () => { /* 句尾由 frame() 里的计时接上，等 gap 之后进入下一节拍 */ });

/* ---- 手动操作与播放器同步：点阶段圆圈、翻页、战役按钮时先暂停，再跳到对应节拍 ---- */
const _go = go, _openBattle = openBattle, _bGo = bGo, _closeBattle = closeBattle;
go = function(c, s, o){ if (P.busy) return _go(c, s, o); const i = beats.findIndex(b => b.type === 'stage' && b.ci === c && b.si === s); pause(); if (i >= 0) { P.started = true; $('intro').hidden = true; startBeat(i, false); } else _go(c, s, o); };
openBattle = function(C, b, pi){ if (P.busy) return _openBattle(C, b, pi); pause(); const i = beats.findIndex(x => x.type === 'battle' && x.b.id === b.id && x.pi === (pi||0)); if (i >= 0) { P.started = true; $('intro').hidden = true; startBeat(i, false); } else _openBattle(C, b, pi); };
bGo = function(pi, instant){ if (P.busy) return _bGo(pi, instant); pause(); const i = beats.findIndex(x => x.type === 'battle' && x.b === BV.b && x.pi === pi); if (i >= 0) startBeat(i, false); else _bGo(pi, instant); };
closeBattle = function(){ if (!P.busy && BV.open) pause(); return _closeBattle(); };
$('b-close').onclick = () => closeBattle();
step = function(d){ jumpScene(d); };

/* ---- 开场 ---- */
const C0 = CHAPTERS[0];
$('in-era').textContent = C0.era; $('in-when').textContent = C0.when; $('in-title').textContent = C0.title; $('in-lead').textContent = C0.oneLiner || '';
$('in-meta').textContent = `${C0.stages.length} 幕 · ${(C0.battles||[]).length} 场战役详图 · 约 ${Math.round(TOTAL/60)} 分钟`;
$('intro').hidden = false; setHelp(false, false);
legendBox.hidden = true; legendBtn.setAttribute('aria-expanded', 'false'); legendBtn.textContent = '图例 ▸';   // 地图上已有势力名，图例默认收起
{ const s = parsePos(location.hash); if (s) { const i = beats.findIndex(b => b.type === 'stage' && b.ci === s[0] && b.si === s[1]); if (i >= 0) P.bi = i; } }
if (P.bi < 0) P.bi = 0;
syncUI(); updateBar(); P.last = performance.now(); setInterval(() => frame(performance.now()), 33);   // 用定时器而不是 rAF：标签页在后台时声音照常播，也要能自动进入下一幕
window.__player = {au, P, beats, startBeat, seekBeat, play, pause, toggle, jumpScene, TOTAL};
})();

</script>
