<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第二次十字军</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 地图占左侧主体（图例浮在右下角），下方时间轴；右侧讲解栏固定高度，只有正文区域内部滚动。 */
:root{
  --bg:#eceeea; --surface:#f7f8f5; --ink:#1f2a33; --muted:#5d6a72; --line:#d3d8d3;
  --accent:#2f4d74; --accent-soft:#e1e7ee; --seal:#b5432f; --sea:#8eabb8;
  --display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --halo:rgba(250,248,240,.92); --lab:#2b2a26; --glass:rgba(247,248,245,.92);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b20; --surface:#1e252b; --ink:#e6e9e6; --muted:#9aa6ad; --line:#333d45;
  --accent:#9db8dc; --accent-soft:#29343f; --seal:#e07a63; --glass:rgba(30,37,43,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b20; --surface:#1e252b; --ink:#e6e9e6; --muted:#9aa6ad; --line:#333d45;
  --accent:#9db8dc; --accent-soft:#29343f; --seal:#e07a63; --glass:rgba(30,37,43,.92); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.7}
.app{display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:minmax(0,1fr);height:100%}
/* 地图右下角：图层开关 + 图例 */
.mapctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);pointer-events:none}
.mapctl>*{pointer-events:auto}
.toggles{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.toggles[hidden]{display:none}
.layers-btn{font:inherit;font-size:12.5px;color:var(--accent);background:var(--glass);border:1px solid var(--line);padding:3px 12px;border-radius:999px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.chip{font:inherit;font-size:12.5px;border:1px solid transparent;background:transparent;color:var(--muted);padding:2px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mapcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
.blk{stroke:none;fill-opacity:.58;transition:fill .6s ease,fill-opacity .3s;mix-blend-mode:multiply;cursor:pointer}
.blk:hover{fill-opacity:.82}
.blocks.dim .blk{fill-opacity:.14}
.blocks.dim .blk.hl{fill-opacity:.82}
.blk.sel{stroke:#1d1a16;stroke-width:2;vector-effect:non-scaling-stroke;fill-opacity:.85}
.bline{fill:none;stroke:#5b4a3a;stroke-opacity:.38;stroke-width:.7;stroke-dasharray:3 2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.pline{fill:none;stroke:#3f3226;stroke-opacity:.8;stroke-width:1.5;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.dao{fill:none;stroke:#7a1f12;stroke-width:3;stroke-opacity:.55;vector-effect:non-scaling-stroke;pointer-events:none}
.river{fill:none;stroke:#7fa3b2;stroke-width:1.2;vector-effect:non-scaling-stroke;pointer-events:none}
text{pointer-events:none}
.plab{font-family:var(--display);font-weight:700;fill:var(--lab);paint-order:stroke;stroke:var(--halo);stroke-width:.25em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;letter-spacing:.05em}
.plab.sm{opacity:0}
.flab{font-family:var(--display);font-weight:900;paint-order:stroke;stroke:var(--halo);stroke-width:.28em;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;letter-spacing:.08em}
.dlab{font-family:var(--display);font-weight:700;fill:#7a1f12;fill-opacity:.85;letter-spacing:.5em;text-anchor:middle;paint-order:stroke;stroke:var(--halo);stroke-width:.2em}
.foreign{font-family:var(--display);fill:#6f6c62;letter-spacing:.5em;text-anchor:middle}
.mk{cursor:copy}
.mk .sym{stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke}
.mk text{font-family:var(--body);font-weight:700;fill:#1d1a16;paint-order:stroke;stroke:var(--halo);stroke-width:.3em;stroke-linejoin:round;dominant-baseline:central}
.mk:hover .sym{stroke:#1d1a16}
.city rect{fill:none;stroke:#6e757b;stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:all;cursor:help}
.city text{font-family:var(--body);font-weight:500;fill:#5d6469;paint-order:stroke;stroke:var(--halo);stroke-width:.3em;stroke-linejoin:round;dominant-baseline:central}
.route{fill:none;stroke-width:3.2;stroke-dasharray:9 6;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none;animation:march 1.2s linear infinite}
.route-halo{fill:none;stroke:rgba(255,255,255,.75);stroke-width:6.5;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.rlab{font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:.3em;stroke-linejoin:round;text-anchor:middle}
@keyframes march{to{stroke-dashoffset:-30}}
/* legend on map */
.legend[hidden]{display:none}
.legend{min-height:0;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-width:100%;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.leg-fac{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,9),auto);gap:1px 6px}
.leg-symwrap{border-top:1px solid var(--line);padding-top:4px}
.leg-symwrap[hidden],.leg-sym[hidden]{display:none}
.leg-subbtn{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:0;padding:1px 6px;cursor:pointer;border-radius:4px}
.leg-subbtn:hover{color:var(--accent)}
.leg-sym{display:grid;grid-template-columns:repeat(2,max-content);gap:1px 14px;padding:2px 0 0}
.leg-sym .it{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:13px;white-space:nowrap}
.leg-sym svg{flex:none}
.leg-sym .mk{cursor:default}
.leg-item{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:13px;white-space:nowrap}
.leg-item:hover,.leg-item.on{background:var(--accent-soft)}
.leg-item .sw{flex:none;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:280px;opacity:0;transition:opacity .15s;z-index:5}
.tip b{font-family:var(--display);font-size:15px}
.tip .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip .meta{color:var(--muted);font-size:12px}
.tip .nt{margin-top:4px;font-size:12.5px}
.tip .hint{margin-top:6px;font-size:11px;color:var(--accent)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
/* 地图右上角：章节标题卡，向地图内渐隐 */
.mapcard{position:absolute;top:0;right:0;max-width:min(560px,70%);padding:16px 20px 60px 140px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;pointer-events:none;
  background:radial-gradient(100% 100% at 100% 0,var(--glass) 0,var(--glass) 55%,transparent 100%)}
.mapcard .era,.mapcard h2,.mapcard .lead,.mapcard .nm{text-shadow:0 0 4px var(--surface),0 0 10px var(--surface)}
.mapcard .lead{color:var(--ink);opacity:.82}
.mapcard>*{pointer-events:auto}
.mapcard .era{justify-content:flex-end}
.mapcard h2{font-family:var(--display);font-weight:900;font-size:30px;line-height:1.2;margin:0;letter-spacing:.06em;text-wrap:balance}
.mapcard .lead{margin:0;font-size:14px;max-width:26em}
.mapcard .people{justify-content:end}
.mapcard .info{margin-left:0}
.mapleft{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:min(340px,45%);pointer-events:none}
.mapleft>*{pointer-events:auto}
.blinks{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.blinks:empty{display:none}
.helpcard[hidden]{display:none}
.helpcard{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 12px;font-size:12.5px;line-height:1.65;box-shadow:0 4px 16px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.helpcard ul{margin:0;padding-left:1.2em}
.helpcard li{margin:2px 0}
.helpcard kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--surface)}
.blinks button{font:600 13px/1 var(--body);display:flex;align-items:center;gap:8px;border:1px solid var(--seal);background:var(--glass);color:var(--seal);padding:8px 14px 8px 10px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);backdrop-filter:blur(4px)}
.blinks button:hover{background:var(--seal);color:#fff}
.blinks svg{width:18px;height:18px}
/* timeline */
.timeline{background:var(--surface);border-top:1px solid var(--line);padding:6px 20px 8px;display:flex;align-items:center;gap:12px}
.timeline button.nav{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:16px}
.tl-scroll{position:relative;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab;-webkit-mask:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.tl-scroll.drag{cursor:grabbing;user-select:none}
.tl-scroll::-webkit-scrollbar{height:6px}.tl-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tl{position:relative;height:60px}
.tl-eras{position:absolute;left:0;right:0;top:26px;height:9px}
.tl-era{position:absolute;top:0;height:100%}
.tl-eralab{position:absolute;top:38px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-dot{position:absolute;top:18px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:transparent;border:0;cursor:pointer;padding:0}
.tl-dot::before{content:"";position:absolute;left:50%;top:50%;width:var(--d,12px);height:var(--d,12px);transform:translate(-50%,-50%);margin:0;box-sizing:border-box;border-radius:50%;background:var(--surface);border:2px solid var(--ink);transition:transform .2s}
.tl-dot.on::before{background:var(--seal);border-color:var(--seal);transform:translate(-50%,-50%) scale(1.35)}
.tl-dot:hover::before{border-color:var(--seal)}
.tl-dot span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tl-dot.nolab span{display:none}
.tl-dot.on span{color:var(--seal);font-weight:700}
.tl-gap{position:absolute;top:18px;width:26px;height:26px;margin-left:-13px;border:0;background:transparent;cursor:help;padding:0}
.tl-gap::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);border:1.5px dashed var(--muted);background:var(--surface);box-sizing:border-box}
.tl-gap:hover::before,.tl-gap:focus-visible::before{border-color:var(--seal);border-style:solid}
.tl-gap span{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
/* panel */
aside{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.p-head{padding:18px 24px 0;display:flex;flex-direction:column;gap:12px}
.era{display:flex;align-items:center;gap:10px}
.era .seal{font-family:var(--display);font-weight:700;color:#fff;background:var(--seal);padding:2px 8px;border-radius:3px;font-size:13px;letter-spacing:.1em}
.era .when{color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px}
.status[hidden]{display:none}
.info{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:italic 700 13px/19px Georgia,serif;text-align:center;cursor:help;background:transparent;padding:0}
.info:hover{border-color:var(--accent);color:var(--accent)}
aside h2{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.04em}
.lead{font-family:var(--display);font-size:15px;line-height:1.65;margin:-4px 0 0;color:var(--muted)}
.people{display:grid;grid-template-columns:repeat(5,max-content);gap:10px;margin:0;padding:0;list-style:none}
.person{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px;cursor:default}
.person .av{width:46px;height:46px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);background:var(--accent-soft)}
.person .av img,.person .av svg{width:100%;height:100%;display:block;object-fit:cover}
.person .nm{font-size:11.5px;line-height:1.3;text-align:center;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person:hover .av{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0;padding:0;list-style:none}
.steps button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--muted);font:600 13px/1 var(--body);cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0}
.steps button:hover{border-color:var(--accent);color:var(--accent)}
.steps button.on{background:var(--seal);border-color:var(--seal);color:#fff}
.steps button.done{border-color:var(--ink);color:var(--ink)}
.steps .sep{flex:1;min-width:8px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:14px;border-top:2px solid var(--ink)}
.stage-head{padding:12px 24px 6px;display:flex;flex-direction:column;gap:1px}
.stage-head .w{color:var(--seal);font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
.stage-head h3{font-family:var(--display);letter-spacing:.03em;font-size:20px;margin:0;font-weight:900;text-wrap:balance}
.stage-body{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 16px}
.stage-body p{margin:0 0 .95em;max-width:65ch}
.stage-body h4{font-family:var(--display);font-size:15px;margin:1.2em 0 .4em}
.stage-body ul,.stage-body ol{margin:0 0 .95em;padding-left:1.4em}
.stage-body li{margin:.25em 0}
.stage-body strong{color:var(--accent)}
.gl{border-bottom:1px dashed var(--muted);cursor:help}
.gl:hover,.gl:focus-visible{border-bottom-color:var(--accent);color:var(--accent)}
.stage-body blockquote{margin:0 0 .95em;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.stage-foot{display:flex;justify-content:space-between;gap:8px;padding:10px 24px 14px;border-top:1px solid var(--line)}
.stage-foot button{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 12px;cursor:pointer;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-foot button:hover{border-color:var(--accent);color:var(--accent)}
.stage-foot button:disabled{visibility:hidden}
.narr-empty{border:1.5px dashed var(--line);border-radius:8px;padding:24px 18px;color:var(--muted);text-align:center;font-size:13px;margin-top:6px}
.narr-empty strong{display:block;font-family:var(--display);font-size:15px;color:var(--ink);margin-bottom:4px}
.summary{color:var(--ink)}
.tline{width:100%;border-collapse:collapse;font-size:13px}
.tline td{padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tline td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);width:1%}
.tline tr[data-s]{cursor:pointer}
.tline tr[data-s]:hover td{background:var(--accent-soft)}
.tline .go{color:var(--accent);font-size:12px;white-space:nowrap}
.ptip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;line-height:1.55;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:300px;opacity:0}
.ptip b{font-family:var(--display);font-size:15px}
.ptip .kbd{margin-top:6px;font-size:11.5px;color:var(--muted)}
.ptip .meta{color:var(--muted);font-size:12px}
.ptip ul{margin:4px 0 0;padding-left:1.2em}
/* ---------- 战役详图 ---------- */
.bview{position:absolute;inset:0;background:#2a2c28;z-index:4}
.bview[hidden]{display:none}
#bmap{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#bmap:active{cursor:grabbing}
.app.battle .mapcard,.app.battle .mapctl,.app.battle .mapleft{display:none}
.app.battle #p-head,.app.battle #p-stage{display:none}
.bpanel{display:none;flex:1;min-height:0;flex-direction:column}
.app.battle .bpanel{display:flex}
.bpanel .back{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 12px 3px 9px;cursor:pointer}
.bpanel .back:hover{border-color:var(--accent);color:var(--accent)}
.bpanel .era .seal{background:#1d1a16}
.sides{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.side{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;background:var(--accent-soft);cursor:default}
.side i{width:14px;height:14px;border-radius:3px;display:inline-block}
.sides .vs{color:var(--muted);font-family:var(--display);font-weight:700}
.bsec{font-family:var(--display);font-size:15px;margin:1em 0 .4em;font-weight:700}
.cmd-list{list-style:none;padding:0;margin:0 0 .8em}
.cmd-list li{display:flex;gap:10px;align-items:flex-start;margin:.45em 0}
.cmd-list .av{flex:none;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c)}
.cmd-list .av svg,.cmd-list .av img{width:100%;height:100%;display:block}
.cmd-list .meta{color:var(--muted);font-size:12.5px}
.bunit rect.box{stroke:#fff;stroke-width:1.6}
.bunit text{font:700 12.5px var(--body);fill:#fff;dominant-baseline:central}
.bunit.shaken rect.box{stroke-dasharray:4 3}
.bunit.routed{opacity:.55}.bunit.routed rect.box{stroke-dasharray:3 3}
.bunit.destroyed rect.box{fill:#6d6a64!important}
.bunit,.bcmd{transition:opacity .4s}
.bcmd text{font:700 12.5px var(--body);fill:#1d1a16;paint-order:stroke;stroke:rgba(250,248,240,.95);stroke-width:4px;stroke-linejoin:round;text-anchor:middle}
.bcmd text.role{font-weight:500;font-size:11px;fill:#4a463e}
.bcmd.killed image{filter:grayscale(1)}
.barrow{fill:none;stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.barrow-halo{fill:none;stroke:rgba(255,255,255,.85);stroke-width:9;vector-effect:non-scaling-stroke;stroke-linecap:round}
.barrow.anim{stroke-dasharray:14 8;animation:march 1s linear infinite}
.blab{font:700 12.5px var(--body);paint-order:stroke;stroke:rgba(250,248,240,.95);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.bfeat-water{fill:#4f8fc4;fill-opacity:.42;stroke:#cfe6ff;stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.bfeat-orchard{fill:#5c9a4a;fill-opacity:.38;stroke:#d7f0c8;stroke-width:1.4;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.bfeat-lab{font:italic 700 13px var(--display);fill:#fff;paint-order:stroke;stroke:rgba(20,30,40,.75);stroke-width:4px;text-anchor:middle;dominant-baseline:central;cursor:help}

r": "埃德萨河东"}}, "assign": {"zengid": "埃德萨河东"}, "flipAt": 5}, "markers": ["edessa", "aleppo", "mosul", "antioch", "jerusalem"], "html": "<p class=\"pt\">要点：第二次十字军的起因，是东方的拉丁国家丢掉了一座城。</p>\n<p><span class=\"sn\" data-i=\"0\">1099年，第一次十字军攻下耶路撒冷。</span><span class=\"sn\" data-i=\"1\">此后东方出现了四个拉丁人的国家：耶路撒冷王国、安条克公国、的黎波里伯国，还有最靠北的埃德萨伯国。</span></p>\n<p><span class=\"sn\" data-i=\"2\">埃德萨在幼发拉底河以东，夹在叙利亚和两河流域之间，是四个国家里位置最突出、也最孤立的一个。</span></p>\n<p><span class=\"sn\" data-i=\"3\">1144年，摩苏尔和阿勒颇的统治者赞吉看准了机会。</span><span class=\"sn\" data-i=\"4\">埃德萨伯爵若瑟林二世带着主力离开了城，城里防守空虚。</span><span class=\"sn\" data-i=\"5\">赞吉围城约四周，12月24日破城。</span></p>\n<p><span class=\"sn\" data-i=\"6\">城里的拉丁居民遭到洗劫，不少人被杀。</span><span class=\"sn\" data-i=\"7\">可是赞吉很快下令停手，他要把这座城留下来当自己的据点。</span></p>\n<p><span class=\"sn\" data-i=\"8\">消息传到西欧，人们第一次意识到：第一次十字军打下来的东西，是可能丢掉的。</span></p>\n<p><span class=\"sn\" data-i=\"9\">所以呢：埃德萨陷落，是第二次十字军的直接起因。</span></p>", "speech": {"key": "s:edessa", "sentences": ["1099年，第一次十字军攻下耶路撒冷。", "此后东方出现了四个拉丁人的国家：耶路撒冷王国、安条克公国、的黎波里伯国，还有最靠北的埃德萨伯国。", "埃德萨在幼发拉底河以东，夹在叙利亚和两河流域之间，是四个国家里位置最突出、也最孤立的一个。", "1144年，摩苏尔和阿勒颇的统治者赞吉看准了机会。", "埃德萨伯爵若瑟林二世带着主力离开了城，城里防守空虚。", "赞吉围城约四周，12月24日破城。", "城里的拉丁居民遭到洗劫，不少人被杀。", "可是赞吉很快下令停手，他要把这座城留下来当自己的据点。", "消息传到西欧，人们第一次意识到：第一次十字军打下来的东西，是可能丢掉的。", "所以呢：埃德萨陷落，是第二次十字军的直接起因。"]}}, {"id": "call", "when": "1145—1147年", "title": "一场布道，让两位国王戴上十字", "view": [5.5, 48.4, 5.2], "markers": ["vezelay", "clairvaux", "speyer"], "image": {"src": "crusades/img/vezelay.webp", "caption": "伯尔纳在韦兹莱布道（19世纪画作，非当时图像）", "credit": "Émile Signol，《圣伯尔纳在韦兹莱宣讲第二次十字军》，1840年，凡尔赛宫藏。图源：Wikimedia Commons，公有领域。"}, "html": "<p class=\"pt\">要点：两位国王不是被劝去的，而是被一场布道和各自的心事推去的。</p>\n<p><span class=\"sn\" data-i=\"0\">教皇尤金三世在1145年底发出诏书，号召西欧再组织一次十字军。</span></p>\n<p><span class=\"sn\" data-i=\"1\">回应最积极的，是法兰西国王路易七世。</span><span class=\"sn\" data-i=\"2\">他本来就想去。</span><span class=\"sn\" data-i=\"3\">1143年他攻打香槟时，士兵烧了维特里的一座教堂，躲在里面的许多百姓被烧死，他一直为此愧疚。</span></p>\n<p><span class=\"sn\" data-i=\"4\">1146年复活节，3月31日，克莱尔沃修道院的院长伯尔纳，在韦兹莱的山坡上当众布道。</span><span class=\"sn\" data-i=\"5\">路易七世带头接过十字架，听的人纷纷挤上来领取缝在衣服上的十字。</span></p>\n<p><span class=\"sn\" data-i=\"6\">伯尔纳接着去德意志巡回布道。</span><span class=\"sn\" data-i=\"7\">德意志国王康拉德三世起初不肯。</span><span class=\"sn\" data-i=\"8\">12月下旬，他在施派尔听了伯尔纳的话，也接受了十字架。</span></p>\n<p><span class=\"sn\" data-i=\"9\">这样，两位国王都要亲自带兵出征。</span></p>\n<p><span class=\"sn\" data-i=\"10\">所以呢：这一次不再是各地诸侯零散出发，而是两个王国的大军。</span></p>", "speech": {"key": "s:call", "sentences": ["教皇尤金三世在1145年底发出诏书，号召西欧再组织一次十字军。", "回应最积极的，是法兰西国王路易七世。", "他本来就想去。", "1143年他攻打香槟时，士兵烧了维特里的一座教堂，躲在里面的许多百姓被烧死，他一直为此愧疚。", "1146年复活节，3月31日，克莱尔沃修道院的院长伯尔纳，在韦兹莱的山坡上当众布道。", "路易七世带头接过十字架，听的人纷纷挤上来领取缝在衣服上的十字。", "伯尔纳接着去德意志巡回布道。", "德意志国王康拉德三世起初不肯。", "12月下旬，他在施派尔听了伯尔纳的话，也接受了十字架。", "这样，两位国王都要亲自带兵出征。", "所以呢：这一次不再是各地诸侯零散出发，而是两个王国的大军。"]}}, {"id": "roads", "when": "1147年5—9月", "title": "两位国王走同一条路：沿多瑙河穿过匈牙利", "view": [17, 46.5, 3.4], "markers": ["metz", "regensburg", "vienna", "esztergom", "belgrade", "nis", "philippopolis", "adrianople", "constantinople"], "routes": ["conrad-road", "louis-road"], "follow": "conrad-road", "image": {"src": "crusades/img/hungary.webp", "caption": "康拉德与路易七世穿越匈牙利（14世纪匈牙利彩绘编年史）", "credit": "《匈牙利彩绘编年史》第119页，约1360年，Márk Kálti 绘。图源：Wikimedia Commons，公有领域。"}, "routeAt": {"conrad-road": [1, 5], "louis-road": [2, 5]}, "html": "<p class=\"pt\">要点：两支大军走了同一条路，沿多瑙河穿过匈牙利，奔向君士坦丁堡。</p>\n<p><span class=\"sn\" data-i=\"0\">出发前，两位国王都选了陆路。</span><span class=\"sn\" data-i=\"1\">康拉德先走：1147年5月，他的军队从雷根斯堡出发，顺着多瑙河往下游走，穿过匈牙利。</span></p>\n<p><span class=\"sn\" data-i=\"2\">路易七世晚了大约一个月，从梅斯动身，沿同一条路线跟上去。</span><span class=\"sn\" data-i=\"3\">王后阿基坦的埃莉诺也随军同行。</span></p>\n<p><span class=\"sn\" data-i=\"4\">匈牙利国王盖佐二世和康拉德并不友好，不过两支军队还是平安通过了。</span></p>\n<p><span class=\"sn\" data-i=\"5\">再往前是保加利亚和色雷斯，已经是拜占庭皇帝的地盘。</span><span class=\"sn\" data-i=\"6\">人多的大军沿途要吃要住，和当地人的摩擦从这里开始增多。</span></p>\n<p><span class=\"sn\" data-i=\"7\">所以呢：走陆路花钱少，却要穿过别人的国土，这是后来许多麻烦的源头。</span></p>", "speech": {"key": "s:roads", "sentences": ["出发前，两位国王都选了陆路。", "康拉德先走：1147年5月，他的军队从雷根斯堡出发，顺着多瑙河往下游走，穿过匈牙利。", "路易七世晚了大约一个月，从梅斯动身，沿同一条路线跟上去。", "王后阿基坦的埃莉诺也随军同行。", "匈牙利国王盖佐二世和康拉德并不友好，不过两支军队还是平安通过了。", "再往前是保加利亚和色雷斯，已经是拜占庭皇帝的地盘。", "人多的大军沿途要吃要住，和当地人的摩擦从这里开始增多。", "所以呢：走陆路花钱少，却要穿过别人的国土，这是后来许多麻烦的源头。"]}}, {"id": "fronts", "when": "1147年夏", "title": "同一个夏天：另外两个方向的十字军", "view": [-1, 46.5, 3.3], "map": {"before": {"assign": {}}, "assign": {"portugal": "里斯本", "iberia": "阿尔梅里亚"}, "flipAt": 7}, "markers": ["dartmouth", "porto", "lisbon", "wends"], "routes": ["lisbon-fleet"], "follow": "lisbon-fleet", "image": {"src": "crusades/img/lisbon.webp", "caption": "里斯本城破的传说场景：马丁·莫尼斯堵住城门（1899年插画）", "credit": "Alfredo Roque Gameiro，插图，载《葡萄牙史（通俗图解本）》，1899年。图源：Wikimedia Commons，公有领域。画面取自后世传说，非当时记录。"}, "routeAt": {"lisbon-fleet": [5, 7]}, "html": "<p class=\"pt\">要点：第二次十字军其实有三个方向，最干净利落的一次胜利，在大西洋边。</p>\n<p><span class=\"sn\" data-i=\"0\">第二次十字军并不只有东方一路。</span></p>\n<p><span class=\"sn\" data-i=\"1\">东边是两位国王的主力，目标是叙利亚。</span></p>\n<p><span class=\"sn\" data-i=\"2\">北边，萨克森等地的诸侯不想走那么远。</span><span class=\"sn\" data-i=\"3\">教皇同意他们去讨伐北方的异教徒文德人。</span><span class=\"sn\" data-i=\"4\">这一路几乎没有什么成果。</span></p>\n<p><span class=\"sn\" data-i=\"5\">西边，一支由英格兰、佛兰德尔和莱茵兰人组成的舰队，春末从英格兰起航，途中在葡萄牙靠岸。</span><span class=\"sn\" data-i=\"6\">葡萄牙国王阿方索·恩里克斯请他们帮忙，攻打穆斯林手里的里斯本。</span></p>\n<p><span class=\"sn\" data-i=\"7\">围城从7月1日开始，10月24日，里斯本投降。</span><span class=\"sn\" data-i=\"8\">这座城从此成了葡萄牙的城市。</span></p>\n<p><span class=\"sn\" data-i=\"9\">同一个10月，卡斯蒂利亚国王在热那亚人的帮助下，夺取了南方的港口阿尔梅里亚。</span></p>\n<p><span class=\"sn\" data-i=\"10\">所以呢：在整个第二次十字军里，里斯本和阿尔梅里亚是少数真正得手的地方，而且都不在东方。</span></p>", "speech": {"key": "s:fronts", "sentences": ["第二次十字军并不只有东方一路。", "东边是两位国王的主力，目标是叙利亚。", "北边，萨克森等地的诸侯不想走那么远。", "教皇同意他们去讨伐北方的异教徒文德人。", "这一路几乎没有什么成果。", "西边，一支由英格兰、佛兰德尔和莱茵兰人组成的舰队，春末从英格兰起航，途中在葡萄牙靠岸。", "葡萄牙国王阿方索·恩里克斯请他们帮忙，攻打穆斯林手里的里斯本。", "围城从7月1日开始，10月24日，里斯本投降。", "这座城从此成了葡萄牙的城市。", "同一个10月，卡斯蒂利亚国王在热那亚人的帮助下，夺取了南方的港口阿尔梅里亚。", "所以呢：在整个第二次十字军里，里斯本和阿尔梅里亚是少数真正得手的地方，而且都不在东方。"]}}, {"id": "constantinople", "when": "1147年9—10月", "title": "君士坦丁堡：东道主与客人互相提防", "view": [30.3, 40.3, 9], "markers": ["constantinople", "nicaea", "dorylaeum", "iconium"], "image": {"src": "crusades/img/constantinople.webp", "caption": "十字军抵达君士坦丁堡（15世纪彩绘）", "credit": "Jean Fouquet，《法兰西大编年史》插图，约1455—1460年，法国国家图书馆藏。图源：Wikimedia Commons，公有领域。"}, "html": "<p class=\"pt\">要点：东道主和客人互相提防，从这里起，十字军没有了可靠的后勤。</p>\n<p><span class=\"sn\" data-i=\"0\">拜占庭皇帝曼努埃尔一世对这支大军心情复杂。</span><span class=\"sn\" data-i=\"1\">他同样信基督，可是他也记得，第一次十字军的拉丁人曾给他的祖父留下过不少麻烦。</span></p>\n<p><span class=\"sn\" data-i=\"2\">康拉德的军队一路上不断和当地人起摩擦，到了城外还发生过冲突。</span><span class=\"sn\" data-i=\"3\">曼努埃尔希望他们尽快渡海，不要在城下久留。</span></p>\n<p><span class=\"sn\" data-i=\"4\">9月下旬，康拉德渡过海峡，进入亚洲。</span><span class=\"sn\" data-i=\"5\">路易七世10月初到达，在城里受到隆重接待，稍后也渡了海。</span></p>\n<p><span class=\"sn\" data-i=\"6\">曼努埃尔手里还有别的事：西边要提防诺曼人，东边刚和罗姆苏丹达成停战。</span><span class=\"sn\" data-i=\"7\">他不想因为这些客人，被拖进新的战争。</span></p>\n<p><span class=\"sn\" data-i=\"8\">所以呢：从这里往东，十字军要靠自己在陌生的高原上找路、找水、找粮。</span></p>", "speech": {"key": "s:constantinople", "sentences": ["拜占庭皇帝曼努埃尔一世对这支大军心情复杂。", "他同样信基督，可是他也记得，第一次十字军的拉丁人曾给他的祖父留下过不少麻烦。", "康拉德的军队一路上不断和当地人起摩擦，到了城外还发生过冲突。", "曼努埃尔希望他们尽快渡海，不要在城下久留。", "9月下旬，康拉德渡过海峡，进入亚洲。", "路易七世10月初到达，在城里受到隆重接待，稍后也渡了海。", "曼努埃尔手里还有别的事：西边要提防诺曼人，东边刚和罗姆苏丹达成停战。", "他不想因为这些客人，被拖进新的战争。", "所以呢：从这里往东，十字军要靠自己在陌生的高原上找路、找水、找粮。"]}}, {"id": "dorylaeum", "when": "1147年10月25日", "title": "多利莱乌姆：德意志军走进缺水的高原", "view": [30.4, 40.0, 11], "markers": ["constantinople", "nicaea", "dorylaeum", "iconium"], "routes": ["conrad-to-dorylaeum", "conrad-retreat"], "follow": "conrad-to-dorylaeum", "battle": "dorylaeum", "image": {"src": "crusades/img/dorylaeum.webp", "caption": "康拉德三世退入小亚细亚（19世纪木刻）", "credit": "Emil Nietzsch Sohn，木刻，载 Mathieu Schwann《巴伐利亚图解史》第二卷，约1890年。图源：Wikimedia Commons，公有领域。画面为后世想象。"}, "routeAt": {"conrad-to-dorylaeum": [0, 2], "conrad-retreat": [6, 6]}, "html": "<p class=\"pt\">要点：康拉德没等法国人，带着德意志军队单独走内陆，在高原上被突袭。</p>\n<p><span class=\"sn\" data-i=\"0\">康拉德渡海之后，没有等路易七世。</span><span class=\"sn\" data-i=\"1\">他带着主力走内陆路线，从尼西亚出发，朝东南穿过小亚细亚，想直接去叙利亚。</span></p>\n<p><span class=\"sn\" data-i=\"2\">拜占庭派给他们的向导，带他们走进了缺水的高原。</span><span class=\"sn\" data-i=\"3\">罗姆苏丹国的骑兵早就盯着这支队伍。</span></p>\n<p><span class=\"sn\" data-i=\"4\">这一仗，没有正面会战，只有一整天的袭扰和追杀。</span><span class=\"sn\" data-i=\"5\">接下来，看战役详图。</span></p>\n<p><span class=\"sn\" data-i=\"6\">所以呢：这一仗之后，德意志军队只剩残部，康拉德只好折回。</span></p>", "speech": {"key": "s:dorylaeum", "sentences": ["康拉德渡海之后，没有等路易七世。", "他带着主力走内陆路线，从尼西亚出发，朝东南穿过小亚细亚，想直接去叙利亚。", "拜占庭派给他们的向导，带他们走进了缺水的高原。", "罗姆苏丹国的骑兵早就盯着这支队伍。", "这一仗，没有正面会战，只有一整天的袭扰和追杀。", "接下来，看战役详图。", "所以呢：这一仗之后，德意志军队只剩残部，康拉德只好折回。"]}}, {"id": "cadmus", "when": "1148年1月", "title": "卡德摩斯山：国王背靠岩壁，抵住了追兵", "view": [28.8, 38.3, 8.5], "markers": ["nicaea", "ephesus", "laodicea", "cadmus", "attalia"], "routes": ["louis-coast"], "follow": "louis-coast", "battle": "cadmus", "image": {"src": "crusades/img/cadmus.webp", "caption": "路易七世在卡德摩斯山抵抗（19世纪版画）", "credit": "Michaud 与 Poujoulat，《十字军史》插图，1886年版。图源：Wikimedia Commons，公有领域。画面为后世想象。"}, "routeAt": {"louis-coast": [1, 2]}, "html": "<p class=\"pt\">要点：法军在山路上被拉成一条长线，国王自己险些送命。</p>\n<p><span class=\"sn\" data-i=\"0\">康拉德生病，回了君士坦丁堡休养。</span><span class=\"sn\" data-i=\"1\">路易七世带着法军沿爱琴海岸往南，先到以弗所，再向东南走到劳迪塞亚。</span></p>\n<p><span class=\"sn\" data-i=\"2\">1148年1月初，军队开始翻越卡德摩斯山。</span><span class=\"sn\" data-i=\"3\">山路很窄，一边是峭壁，一边是深沟。</span></p>\n<p><span class=\"sn\" data-i=\"4\">这一仗，国王自己就在最危险的地方。</span><span class=\"sn\" data-i=\"5\">接下来，看战役详图。</span></p>\n<p><span class=\"sn\" data-i=\"6\">所以呢：这一仗之后，法军的行军方式变了，改由圣殿骑士负责组织。</span></p>", "speech": {"key": "s:cadmus", "sentences": ["康拉德生病，回了君士坦丁堡休养。", "路易七世带着法军沿爱琴海岸往南，先到以弗所，再向东南走到劳迪塞亚。", "1148年1月初，军队开始翻越卡德摩斯山。", "山路很窄，一边是峭壁，一边是深沟。", "这一仗，国王自己就在最危险的地方。", "接下来，看战役详图。", "所以呢：这一仗之后，法军的行军方式变了，改由圣殿骑士负责组织。"]}}, {"id": "attalia", "when": "1148年2—3月", "title": "阿塔利亚：船不够，国王带着贵族先走", "view": [33.5, 36.4, 6], "markers": ["attalia", "stsymeon", "antioch"], "routes": ["louis-sea"], "follow": "louis-sea", "image": {"src": "crusades/img/antioch.webp", "caption": "安条克亲王雷蒙德迎接路易七世（15世纪彩绘）", "credit": "Jean Colombe 与 Sébastien Mamerot，《海外远征记》插图，15世纪。图源：Wikimedia Commons，公有领域。"}, "routeAt": {"louis-sea": [4, 6]}, "html": "<p class=\"pt\">要点：港口里的船不够，国王带着贵族先走，其余的人被留下。</p>\n<p><span class=\"sn\" data-i=\"0\">法军沿海岸又走了三个星期，一路被土耳其骑兵骚扰，粮食越来越少。</span><span class=\"sn\" data-i=\"1\">1月底，他们到达拜占庭的海港阿塔利亚，也就是今天的安塔利亚。</span></p>\n<p><span class=\"sn\" data-i=\"2\">他们本来想乘船去叙利亚。</span><span class=\"sn\" data-i=\"3\">可是港里的船远远不够，价钱又涨得厉害。</span></p>\n<p><span class=\"sn\" data-i=\"4\">路易七世只好带着王后、贵族和骑士先走，步兵和朝圣者留在原地，继续走陆路或者等船。</span><span class=\"sn\" data-i=\"5\">留下的人，大多没能走到叙利亚。</span></p>\n<p><span class=\"sn\" data-i=\"6\">3月19日，路易七世终于在安条克的港口登岸。</span></p>\n<p><span class=\"sn\" data-i=\"7\">安条克亲王雷蒙德，正是埃莉诺的叔叔，他迎接得极为热情。</span><span class=\"sn\" data-i=\"8\">雷蒙德希望路易先去打阿勒颇，夺回北方的主动权。</span><span class=\"sn\" data-i=\"9\">路易却一心要先去耶路撒冷朝圣。</span></p>\n<p><span class=\"sn\" data-i=\"10\">埃莉诺站在叔叔这边，夫妻关系也在这里变坏。</span><span class=\"sn\" data-i=\"11\">据当时的记载，路易最后是半夜带着她离开安条克的。</span></p>\n<p><span class=\"sn\" data-i=\"12\">所以呢：北方诸国要的是收复埃德萨一带，远征军想要的是耶路撒冷，两边的目标从这里错开了。</span></p>", "speech": {"key": "s:attalia", "sentences": ["法军沿海岸又走了三个星期，一路被土耳其骑兵骚扰，粮食越来越少。", "1月底，他们到达拜占庭的海港阿塔利亚，也就是今天的安塔利亚。", "他们本来想乘船去叙利亚。", "可是港里的船远远不够，价钱又涨得厉害。", "路易七世只好带着王后、贵族和骑士先走，步兵和朝圣者留在原地，继续走陆路或者等船。", "留下的人，大多没能走到叙利亚。", "3月19日，路易七世终于在安条克的港口登岸。", "安条克亲王雷蒙德，正是埃莉诺的叔叔，他迎接得极为热情。", "雷蒙德希望路易先去打阿勒颇，夺回北方的主动权。", "路易却一心要先去耶路撒冷朝圣。", "埃莉诺站在叔叔这边，夫妻关系也在这里变坏。", "据当时的记载，路易最后是半夜带着她离开安条克的。", "所以呢：北方诸国要的是收复埃德萨一带，远征军想要的是耶路撒冷，两边的目标从这里错开了。"]}}, {"id": "acre", "when": "1148年6月24日", "title": "阿克会议：目标选成了大马士革", "view": [35.7, 33.2, 11], "markers": ["acre", "jerusalem", "damascus", "tripoli"], "routes": ["louis-south", "conrad-sea"], "image": {"src": "crusades/img/acre.webp", "caption": "阿克会议：康拉德三世、路易七世与鲍德温三世（约1280年彩绘）", "credit": "无名画师，约1280年。图源：Wikimedia Commons，公有领域。"}, "routeAt": {"conrad-sea": [0, 0], "louis-south": [0, 0]}, "html": "<p class=\"pt\">要点：会议选错了对象：把一个多年的盟友，当成了要攻打的敌人。</p>\n<p><span class=\"sn\" data-i=\"0\">康拉德在春天乘船到了阿克，路易七世也到了耶路撒冷。</span><span class=\"sn\" data-i=\"1\">耶路撒冷的年轻国王鲍德温三世和他的母亲、女王梅丽桑德，在阿克召开了一次大会。</span></p>\n<p><span class=\"sn\" data-i=\"2\">6月24日的这次会议上，大家决定去打大马士革，而不是去收复埃德萨，也不是去打阿勒颇。</span></p>\n<p><span class=\"sn\" data-i=\"3\">理由很直接：大马士革离耶路撒冷近，又是一座富庶的大城，拿下来能巩固王国的北边。</span></p>\n<p><span class=\"sn\" data-i=\"4\">可是大马士革的实际掌权者乌努尔，正是耶路撒冷多年的盟友。</span><span class=\"sn\" data-i=\"5\">1140年，他们订过盟约，一起对付赞吉。</span></p>\n<p><span class=\"sn\" data-i=\"6\">于是十字军把一个盟友，推到了真正的对手那一边。</span></p>\n<p><span class=\"sn\" data-i=\"7\">所以呢：后来的史家大多认为，第二次十字军的方向，是在这里选错的。</span></p>", "speech": {"key": "s:acre", "sentences": ["康拉德在春天乘船到了阿克，路易七世也到了耶路撒冷。", "耶路撒冷的年轻国王鲍德温三世和他的母亲、女王梅丽桑德，在阿克召开了一次大会。", "6月24日的这次会议上，大家决定去打大马士革，而不是去收复埃德萨，也不是去打阿勒颇。", "理由很直接：大马士革离耶路撒冷近，又是一座富庶的大城，拿下来能巩固王国的北边。", "可是大马士革的实际掌权者乌努尔，正是耶路撒冷多年的盟友。", "1140年，他们订过盟约，一起对付赞吉。", "于是十字军把一个盟友，推到了真正的对手那一边。", "所以呢：后来的史家大多认为，第二次十字军的方向，是在这里选错的。"]}}, {"id": "damascus", "when": "1148年7月23—28日", "title": "大马士革：四天围攻，败在果园里", "view": [36.1, 33.4, 14], "markers": ["acre", "damascus"], "routes": ["to-damascus", "from-damascus"], "follow": "to-damascus", "battle": "damascus", "image": {"src": "crusades/img/damascus.webp", "caption": "大马士革之围（14世纪彩绘）", "credit": "无名画师，《海外编年史》插图，14世纪，大英图书馆藏（Royal 16 G VI, f.322）。图源：Wikimedia Commons，公有领域。"}, "routeAt": {"to-damascus": [0, 1], "from-damascus": [5, 5]}, "html": "<p class=\"pt\">要点：四天围攻，败在果园里：换了营地，丢了水，也丢了时间。</p>\n<p><span class=\"sn\" data-i=\"0\">1148年7月23日，三支军队抵达大马士革城西的古塔绿洲。</span><span class=\"sn\" data-i=\"1\">耶路撒冷国王鲍德温三世带前锋，路易七世居中，康拉德殿后。</span></p>\n<p><span class=\"sn\" data-i=\"2\">古塔绿洲是一片果园和沟渠。</span><span class=\"sn\" data-i=\"3\">有水，有树，对攻方是个好营地，对守方也一样方便设伏。</span></p>\n<p><span class=\"sn\" data-i=\"4\">接下来四天，这座城的命运，在果园、河岸和一次移营之间被决定。</span><span class=\"sn\" data-i=\"5\">看战役详图。</span></p>\n<p><span class=\"sn\" data-i=\"6\">所以呢：这一仗之后，十字军再也没有集合起这样的力量。</span></p>", "speech": {"key": "s:damascus", "sentences": ["1148年7月23日，三支军队抵达大马士革城西的古塔绿洲。", "耶路撒冷国王鲍德温三世带前锋，路易七世居中，康拉德殿后。", "古塔绿洲是一片果园和沟渠。", "有水，有树，对攻方是个好营地，对守方也一样方便设伏。", "接下来四天，这座城的命运，在果园、河岸和一次移营之间被决定。", "看战役详图。", "所以呢：这一仗之后，十字军再也没有集合起这样的力量。"]}}, {"id": "aftermath", "when": "1148—1154年", "title": "败退之后：赢的是努尔丁", "view": [37.0, 35.4, 6.5], "map": {"assign": {"zengid": "大马士革"}, "notes": {"大马士革": "1154年4月，努尔丁进入大马士革，这里自此并入赞吉系的版图。"}, "before": {"assign": {}}, "flipAt": 3}, "markers": ["damascus", "aleppo", "antioch", "inab", "jerusalem"], "html": "<p class=\"pt\">要点：十字军失败了，真正的赢家是努尔丁，他后来把大马士革也收了过去。</p>\n<p><span class=\"sn\" data-i=\"0\">大马士革之围失败后，康拉德在1148年9月离开，回到德意志。</span><span class=\"sn\" data-i=\"1\">路易七世又留了几个月，1149年才回国。</span></p>\n<p><span class=\"sn\" data-i=\"2\">1149年6月，努尔丁在伊纳卜打败了安条克的雷蒙德，雷蒙德战死。</span></p>\n<p><span class=\"sn\" data-i=\"3\">1154年，努尔丁进入大马士革，叙利亚的穆斯林势力第一次连成一片。</span></p>\n<p><span class=\"sn\" data-i=\"4\">三十多年后，埃及的萨拉丁沿着这条路继续走下去，夺回了耶路撒冷。</span></p>\n<p><span class=\"sn\" data-i=\"5\">伯尔纳因为这次失败受到许多批评。</span><span class=\"sn\" data-i=\"6\">他自己的解释是：罪在十字军自己的罪孽。</span></p>\n<p><span class=\"sn\" data-i=\"7\">所以呢：第二次十字军没有收复埃德萨，还失去了一个盟友。</span><span class=\"sn\" data-i=\"8\">它真正的后果，是让穆斯林一方有了联合起来的理由。</span></p>", "speech": {"key": "s:aftermath", "sentences": ["大马士革之围失败后，康拉德在1148年9月离开，回到德意志。", "路易七世又留了几个月，1149年才回国。", "1149年6月，努尔丁在伊纳卜打败了安条克的雷蒙德，雷蒙德战死。", "1154年，努尔丁进入大马士革，叙利亚的穆斯林势力第一次连成一片。", "三十多年后，埃及的萨拉丁沿着这条路继续走下去，夺回了耶路撒冷。", "伯尔纳因为这次失败受到许多批评。", "他自己的解释是：罪在十字军自己的罪孽。", "所以呢：第二次十字军没有收复埃德萨，还失去了一个盟友。", "它真正的后果，是让穆斯林一方有了联合起来的理由。"]}}], "timeline": [{"date": "1144.12.24", "text": "赞吉攻陷埃德萨", "stage": "edessa"}, {"date": "1146.03.31", "text": "伯尔纳在韦兹莱布道，路易七世接受十字架", "stage": "call"}, {"date": "1146.12", "text": "康拉德三世在施派尔接受十字架", "stage": "call"}, {"date": "1147.05", "text": "康拉德的军队从雷根斯堡出发", "stage": "roads"}, {"date": "1147.07—10", "text": "里斯本之围，10月24日城降", "stage": "fronts"}, {"date": "1147.09—10", "text": "两支大军先后渡过博斯普鲁斯海峡", "stage": "constantinople"}, {"date": "1147.10.25", "text": "多利莱乌姆：德意志军受袭", "stage": "dorylaeum"}, {"date": "1148.01", "text": "卡德摩斯山：法军后队被截断", "stage": "cadmus"}, {"date": "1148.03.19", "text": "路易七世在安条克登岸", "stage": "attalia"}, {"date": "1148.06.24", "text": "阿克会议，决定进攻大马士革", "stage": "acre"}, {"date": "1148.07.24—28", "text": "大马士革之围，十字军撤退", "stage": "damascus"}, {"date": "1149.06.29", "text": "伊纳卜之战，雷蒙德战死", "stage": "aftermath"}, {"date": "1154.04", "text": "努尔丁进入大马士革", "stage": "aftermath"}], "sources": ["综合通行研究与史料编写，主要线索来自：提尔的威廉《海外编年史》；德伊的奥多《路易七世远征记》；弗赖辛的奥托《腓特烈传》。", "现代研究参考：Jonathan Phillips，The Second Crusade（2007）；Steven Runciman，A History of the Crusades 第二卷（1952）；Christopher Tyerman，God's War（2006）。", "地图：地形数据 Mapzen Terrain Tiles；海岸线与水系 Natural Earth。政治版图按12世纪中叶的大致格局概括，内陆边界为示意。"], "battles": [{"id": "dorylaeum", "name": "多利莱乌姆之战", "stage": "dorylaeum", "when": "1147年10月25日前后", "date_note": "日期按通行说法；地点在今土耳其埃斯基谢希尔一带，战场的确切位置没有定论。", "location": {"name": "小亚细亚西北部，多利莱乌姆（今埃斯基谢希尔）附近的高原", "lon": 30.45, "lat": 39.8}, "view": {"center": [30.4, 39.8], "span_km": 30, "aspect": 1.5}, "sides": {"a": {"name": "德意志军", "color": "#d1a23a", "commanders": [{"name": "康拉德三世", "role": "德意志国王", "unit": "a-main", "look": "warrior", "note": "德意志国王，率军走内陆路线。"}]}, "b": {"name": "罗姆苏丹国军", "color": "#d2692e", "commanders": [{"name": "马苏德一世", "role": "罗姆苏丹", "unit": "b-north", "look": "warrior", "note": "罗姆苏丹。当时的记载对他是否亲临战场说法不一，这里只表示这一方的统帅。"}]}}, "units": [{"id": "a-main", "side": "a", "name": "德意志骑士", "kind": "cavalry", "lon": 30.26, "lat": 39.79, "moves": [{"phase": "p1", "to": [30.38, 39.78], "action": "向东南行军"}, {"phase": "p3", "to": [30.24, 39.81], "action": "折回尼西亚方向", "state": "shaken"}]}, {"id": "a-train", "side": "a", "name": "步行者与辎重", "kind": "infantry", "lon": 30.23, "lat": 39.775, "moves": [{"phase": "p1", "to": [30.33, 39.77], "action": "掉队拉长"}, {"phase": "p2", "state": "shaken"}, {"phase": "p3", "to": [30.21, 39.79], "state": "shaken"}]}, {"id": "b-north", "side": "b", "name": "罗姆骑射手（北）", "kind": "archers", "lon": 30.46, "lat": 39.95, "moves": [{"phase": "p2", "to": [30.37, 39.84], "action": "从北侧袭扰"}, {"phase": "p3", "to": [30.3, 39.84], "action": "追击"}]}, {"id": "b-south", "side": "b", "name": "罗姆骑射手（南）", "kind": "archers", "lon": 30.47, "lat": 39.64, "moves": [{"phase": "p2", "to": [30.36, 39.73], "action": "从南侧袭扰"}, {"phase": "p3", "to": [30.29, 39.74], "action": "追击"}]}], "features": [{"kind": "label", "name": "多利莱乌姆（今埃斯基谢希尔，推定）", "lon": 30.52, "lat": 39.77, "note": "古城多利莱乌姆的位置，战场在它的西面一带，位置为推定。"}, {"kind": "line", "name": "去内地的大道（推定）", "color": "#f3e3b0", "points": [[30.1, 39.84], [30.26, 39.8], [30.4, 39.78], [30.55, 39.75]], "note": "从尼西亚去小亚细亚内地的通道，路线为推定。"}], "phases": [{"id": "p1", "time": "10月下旬", "title": "德意志军在高原上被拉成一条长队", "desc": "德意志军离开尼西亚后，沿着通向内地的大道往东南走。骑士走在前面，步行的朝圣者和辎重落在后面。\n\n高原上水源少，路又长。队伍越拉越长，前后渐渐连不上。", "html": "<p><span class=\"sn\" data-i=\"0\">德意志军离开尼西亚后，沿着通向内地的大道往东南走。</span><span class=\"sn\" data-i=\"1\">骑士走在前面，步行的朝圣者和辎重落在后面。</span></p>\n<p><span class=\"sn\" data-i=\"2\">高原上水源少，路又长。</span><span class=\"sn\" data-i=\"3\">队伍越拉越长，前后渐渐连不上。</span></p>", "speech": {"key": "b:dorylaeum:1", "sentences": ["德意志军离开尼西亚后，沿着通向内地的大道往东南走。", "骑士走在前面，步行的朝圣者和辎重落在后面。", "高原上水源少，路又长。", "队伍越拉越长，前后渐渐连不上。"]}}, {"id": "p2", "time": "战斗当天", "title": "罗姆骑射手从两侧冲出，专打掉队的人", "desc": "罗姆苏丹国的骑射手早就守在高原边缘。他们不和骑士正面相撞，而是从南北两侧轮流冲上来放箭，再迅速退走。\n\n每冲一次，队尾就倒下一批人。骑士追不上，辎重也丢了不少。", "html": "<p><span class=\"sn\" data-i=\"0\">罗姆苏丹国的骑射手早就守在高原边缘。</span><span class=\"sn\" data-i=\"1\">他们不和骑士正面相撞，而是从南北两侧轮流冲上来放箭，再迅速退走。</span></p>\n<p><span class=\"sn\" data-i=\"2\">每冲一次，队尾就倒下一批人。</span><span class=\"sn\" data-i=\"3\">骑士追不上，辎重也丢了不少。</span></p>", "speech": {"key": "b:dorylaeum:2", "sentences": ["罗姆苏丹国的骑射手早就守在高原边缘。", "他们不和骑士正面相撞，而是从南北两侧轮流冲上来放箭，再迅速退走。", "每冲一次，队尾就倒下一批人。", "骑士追不上，辎重也丢了不少。"]}}, {"id": "p3", "time": "当天傍晚", "title": "康拉德无法追上对手，只能下令撤回", "desc": "德意志骑士无法追上跑得更快的对手，也无法一边保护队尾一边向前。康拉德只好下令折回。\n\n撤退的路上，罗姆骑射手一直跟在后面袭扰。德意志军带着伤员和残存的人马，退向尼西亚。", "html": "<p><span class=\"sn\" data-i=\"0\">德意志骑士无法追上跑得更快的对手，也无法一边保护队尾一边向前。</span><span class=\"sn\" data-i=\"1\">康拉德只好下令折回。</span></p>\n<p><span class=\"sn\" data-i=\"2\">撤退的路上，罗姆骑射手一直跟在后面袭扰。</span><span class=\"sn\" data-i=\"3\">德意志军带着伤员和残存的人马，退向尼西亚。</span></p>", "speech": {"key": "b:dorylaeum:3", "sentences": ["德意志骑士无法追上跑得更快的对手，也无法一边保护队尾一边向前。", "康拉德只好下令折回。", "撤退的路上，罗姆骑射手一直跟在后面袭扰。", "德意志军带着伤员和残存的人马，退向尼西亚。"]}}], "terrain": "多利莱乌姆在小亚细亚西北部的高原边缘，是从尼西亚去内地的必经之地。\n\n这里地势开阔，水源稀少。熟悉地形的罗姆骑射手，可以在开阔地上来去自如，而不熟悉地形的远征军，容易被拉成一条长线。", "outcome": "德意志军损失惨重，不得不退回尼西亚一带。康拉德没有再继续走内陆路线。\n\n法国军队随后赶到，两位国王的军队合在一起，改走更长、却更安全的沿海路。", "strength_note": "各种记载对兵力说法不一，本图不画兵力。", "confidence": "low", "sources": [{"kind": "external", "ref": "德伊的奥多《路易七世远征记》（当时的法国记载）"}, {"kind": "external", "ref": "弗赖辛的奥托《腓特烈传》（当时的德意志记载）"}, {"kind": "external", "ref": "Jonathan Phillips，The Second Crusade（2007）"}], "needs_check": ["战场的确切位置与交战日期，不同研究的说法有出入。", "当天德意志军是否已经分成两路，史料说法不完全一致，本图只画主力。", "马苏德是否亲自指挥，史料说法不一。", "图中各部队的位置与箭头为示意。"], "terrainHtml": "<p><span class=\"sn\" data-i=\"0\">多利莱乌姆在小亚细亚西北部的高原边缘，是从尼西亚去内地的必经之地。</span></p>\n<p><span class=\"sn\" data-i=\"1\">这里地势开阔，水源稀少。</span><span class=\"sn\" data-i=\"2\">熟悉地形的罗姆骑射手，可以在开阔地上来去自如，而不熟悉地形的远征军，容易被拉成一条长线。</span></p>", "outcomeHtml": "<p><span class=\"sn\" data-i=\"0\">德意志军损失惨重，不得不退回尼西亚一带。</span><span class=\"sn\" data-i=\"1\">康拉德没有再继续走内陆路线。</span></p>\n<p><span class=\"sn\" data-i=\"2\">法国军队随后赶到，两位国王的军队合在一起，改走更长、却更安全的沿海路。</span></p>", "speech0": {"key": "b:dorylaeum:0", "sentences": ["多利莱乌姆在小亚细亚西北部的高原边缘，是从尼西亚去内地的必经之地。", "这里地势开阔，水源稀少。", "熟悉地形的罗姆骑射手，可以在开阔地上来去自如，而不熟悉地形的远征军，容易被拉成一条长线。"]}, "speechN": {"key": "b:dorylaeum:4", "sentences": ["德意志军损失惨重，不得不退回尼西亚一带。", "康拉德没有再继续走内陆路线。", "法国军队随后赶到，两位国王的军队合在一起，改走更长、却更安全的沿海路。"]}, "_img": {"src": "crusades/battles/dorylaeum.webp", "bbox": [30.2246, 39.7096, 30.5754, 39.8904], "w": 3000, "h": 2013, "credit": "卫星影像：Copernicus Sentinel-2 L2A（2024-11-09、2024-12-14），约 10 米/像素"}}, {"id": "cadmus", "name": "卡德摩斯山之战", "stage": "cadmus", "when": "1148年1月初", "date_note": "通行说法为1148年1月6日前后；确切日期有出入。", "location": {"name": "卡德摩斯山（今霍纳兹山）一带的山路，劳迪塞亚南面", "lon": 29.4, "lat": 37.58}, "view": {"center": [29.4, 37.58], "span_km": 18  37.7, "note": "今土耳其霍纳兹山，海拔两千多米，是这一带最高的山。"}, {"kind": "label", "name": "劳迪塞亚方向（北）", "lon": 29.33, "lat": 37.7, "note": "法军从北面的劳迪塞亚一带进山。"}, {"kind": "line", "name": "去阿塔利亚的路（推定）", "color": "#f3e3b0", "points": [[29.28, 37.69], [29.34, 37.62], [29.4, 37.57], [29.48, 37.5], [29.58, 37.44]], "note": "法军翻山的大致路线，位置为推定。"}], "phases": [{"id": "p1", "time": "1月初 白天", "title": "先头部队翻过山口后没有停下，与主队拉开了距离", "desc": "国王下令，先头部队翻过山头后要在高处等后队跟上。可是先头指挥官若弗鲁瓦走过山口，觉得前面地势平缓，就继续往前。\n\n国王和后面的队伍还在山腰，前后越拉越远，中间出现了一大段空隙。", "html": "<p><span class=\"sn\" data-i=\"0\">国王下令，先头部队翻过山头后要在高处等后队跟上。</span><span class=\"sn\" data-i=\"1\">可是先头指挥官若弗鲁瓦走过山口，觉得前面地势平缓，就继续往前。</span></p>\n<p><span class=\"sn\" data-i=\"2\">国王和后面的队伍还在山腰，前后越拉越远，中间出现了一大段空隙。</span></p>", "speech": {"key": "b:cadmus:1", "sentences": ["国王下令，先头部队翻过山头后要在高处等后队跟上。", "可是先头指挥官若弗鲁瓦走过山口，觉得前面地势平缓，就继续往前。", "国王和后面的队伍还在山腰，前后越拉越远，中间出现了一大段空隙。"]}}, {"id": "p2", "time": "午后", "title": "突厥骑射手占住山头，把后队截断", "desc": "附近的突厥骑射手早就在山上盯着。他们看到队伍断开，就从两侧冲下来，占住山头，把辎重和朝圣者组成的后队截在了山路上。\n\n山路窄，一边是峭壁，一边是深沟，人和马挤在一起，既退不回去，也过不去。", "html": "<p><span class=\"sn\" data-i=\"0\">附近的突厥骑射手早就在山上盯着。</span><span class=\"sn\" data-i=\"1\">他们看到队伍断开，就从两侧冲下来，占住山头，把辎重和朝圣者组成的后队截在了山路上。</span></p>\n<p><span class=\"sn\" data-i=\"2\">山路窄，一边是峭壁，一边是深沟，人和马挤在一起，既退不回去，也过不去。</span></p>", "speech": {"key": "b:cadmus:2", "sentences": ["附近的突厥骑射手早就在山上盯着。", "他们看到队伍断开，就从两侧冲下来，占住山头，把辎重和朝圣者组成的后队截在了山路上。", "山路窄，一边是峭壁，一边是深沟，人和马挤在一起，既退不回去，也过不去。"]}}, {"id": "p3", "time": "傍晚", "title": "国王的卫队被冲散，路易七世背靠岩壁独自抵挡", "desc": "国王身边的卫队被冲散。据当时的记载，路易七世攀上一块岩壁，背靠它，用剑抵挡冲上来的人。\n\n他没有穿显眼的王袍，对方没有认出这是国王。后队的朝圣者大多没有这么幸运，纷纷溃散。", "events": [{"lon": 29.41, "lat": 37.56, "text": "国王背靠岩壁抵抗"}], "html": "<p><span class=\"sn\" data-i=\"0\">国王身边的卫队被冲散。</span><span class=\"sn\" data-i=\"1\">据当时的记载，路易七世攀上一块岩壁，背靠它，用剑抵挡冲上来的人。</span></p>\n<p><span class=\"sn\" data-i=\"2\">他没有穿显眼的王袍，对方没有认出这是国王。</span><span class=\"sn\" data-i=\"3\">后队的朝圣者大多没有这么幸运，纷纷溃散。</span></p>", "speech": {"key": "b:cadmus:3", "sentences": ["国王身边的卫队被冲散。", "据当时的记载，路易七世攀上一块岩壁，背靠它，用剑抵挡冲上来的人。", "他没有穿显眼的王袍，对方没有认出这是国王。", "后队的朝圣者大多没有这么幸运，纷纷溃散。"]}}, {"id": "p4", "time": "夜里", "title": "夜色救了国王，行军改由圣殿骑士负责", "desc": "天黑之后，追兵退去。路易七世趁夜脱身，摸到先头部队的营地。\n\n第二天清点，后队损失惨重，辎重也丢了大半。此后，军队的行军改由圣殿骑士负责，大家分成小队，互相掩护着走。", "html": "<p><span class=\"sn\" data-i=\"0\">天黑之后，追兵退去。</span><span class=\"sn\" data-i=\"1\">路易七世趁夜脱身，摸到先头部队的营地。</span></p>\n<p><span class=\"sn\" data-i=\"2\">第二天清点，后队损失惨重，辎重也丢了大半。</span><span class=\"sn\" data-i=\"3\">此后，军队的行军改由圣殿骑士负责，大家分成小队，互相掩护着走。</span></p>", "speech": {"key": "b:cadmus:4", "sentences": ["天黑之后，追兵退去。", "路易七世趁夜脱身，摸到先头部队的营地。", "第二天清点，后队损失惨重，辎重也丢了大半。", "此后，军队的行军改由圣殿骑士负责，大家分成小队，互相掩护着走。"]}}], "terrain": "卡德摩斯山在劳迪塞亚南面，是通往阿塔利亚的必经山路。\n\n山路很窄，一边是峭壁，一边是深沟。大军只能拉成一条长线前进，前后很难互相照应。", "outcome": "法军损失了大量辎重和后队的朝圣者，国王的威信也受了损。\n\n此后，行军由圣殿骑士组织，军队分成小队，一路走到阿塔利亚。", "strength_note": "各种记载对兵力说法不一，本图不画兵力。", "confidence": "medium", "sources": [{"kind": "external", "ref": "德伊的奥多《路易七世远征记》（亲历者记载）"}, {"kind": "external", "ref": "Jonathan Phillips，The Second Crusade（2007）"}], "needs_check": ["战场位置：只知道在卡德摩斯山一带的山路上，具体地点为推定。", "日期：通行说法为1月6日前后，确切日期有出入。", "图中各部队的位置与箭头为示意。", "国王是否被对方认出，以及他躲避的是岩壁还是树，不同记载说法不同。"], "terrainHtml": "<p><span class=\"sn\" data-i=\"0\">卡德摩斯山在劳迪塞亚南面，是通往阿塔利亚的必经山路。</span></p>\n<p><span class=\"sn\" data-i=\"1\">山路很窄，一边是峭壁，一边是深沟。</span><span class=\"sn\" data-i=\"2\">大军只能拉成一条长线前进，前后很难互相照应。</span></p>", "outcomeHtml": "<p><span class=\"sn\" data-i=\"0\">法军损失了大量辎重和后队的朝圣者，国王的威信也受了损。</span></p>\n<p><span class=\"sn\" data-i=\"1\">此后，行军由圣殿骑士组织，军队分成小队，一路走到阿塔利亚。</span></p>", "speech0": {"key": "b:cadmus:0", "sentences": ["卡德摩斯山在劳迪塞亚南面，是通往阿塔利亚的必经山路。", "山路很窄，一边是峭壁，一边是深沟。", "大军只能拉成一条长线前进，前后很难互相照应。"]}, "speechN": {"key": "b:cadmus:5", "sentences": ["法军损失了大量辎重和后队的朝圣者，国王的威信也受了损。", "此后，行军由圣殿骑士组织，军队分成小队，一路走到阿塔利亚。"]}, "_img": {"src": "crusades/battles/cadmus.webp", "bbox": [29.298, 37.5257, 29.502, 37.6343], "w": 1800, "h": 1209, "credit": "卫星影像：Copernicus Sentinel-2 L2A（2024-01-14），约 10 米/像素"}}, {"id": "damascus", "name": "大马士革之围", "stage": "damascus", "wh 墙"}, {"phase": "p2", "to": [36.2, 33.53], "action": "重新占据果园"}, {"phase": "p3", "to": [36.27, 33.5], "action": "封住果园"}]}, {"id": "c-relief", "side": "c", "name": "援军", "kind": "cavalry", "lon": 36.4, "lat": 33.82, "moves": [{"phase": "p2", "to": [36.35, 33.7], "action": "赶来增援"}, {"phase": "p4", "to": [36.2, 33.5], "action": "出城追击"}]}], "features": [{"kind": "orchard", "name": "古塔绿洲（果园与沟渠）", "note": "城西的大片果园，有河水和沟渠。对攻守双方都有利：攻方有水，守方有遮蔽。边界为推定。", "points": [[35.98, 33.64], [36.05, 33.62], [36.12, 33.6], [36.19, 33.58], [36.26, 33.555], [36.275, 33.52], [36.26, 33.49], [36.22, 33.47], [36.16, 33.46], [36.1, 33.47], [36.05, 33.5], [36.0, 33.54], [35.96, 33.59]]}, {"kind": "line", "name": "巴拉达河（推定）", "color": "#9ad0ff", "points": [[35.95, 33.64], [36.08, 33.57], [36.2, 33.54], [36.29, 33.525]], "note": "流经大马士革的河，水源所在，位置为推定。"}, {"kind": "label", "name": "城东南的平地", "lon": 36.38, "lat": 33.46, "note": "这里地势开阔，却没有水，也没有树荫。十字军后来把营地移到了这里。"}, {"kind": "label", "name": "盖松山（推定）", "lon": 36.3, "lat": 33.56, "note": "俯视大马士革城的山。"}], "phases": [{"id": "p1", "time": "7月24日", "title": "十字军冲进果园，把守军逼回城墙", "desc": "7月24日，十字军从西面冲进古塔绿洲。耶路撒冷军在前，法军在中间，德意志军殿后。\n\n他们占住了河岸和水源，守军和民兵被逼退到城墙下。", "events": [{"lon": 36.19, "lat": 33.525, "text": "占住河岸与水源"}], "html": "<p><span class=\"sn\" data-i=\"0\">7月24日，十字军从西面冲进古塔绿洲。</span><span class=\"sn\" data-i=\"1\">耶路撒冷军在前，法军在中间，德意志军殿后。</span></p>\n<p><span class=\"sn\" data-i=\"2\">他们占住了河岸和水源，守军和民兵被逼退到城墙下。</span></p>", "speech": {"key": "b:damascus:1", "sentences": ["7月24日，十字军从西面冲进古塔绿洲。", "耶路撒冷军在前，法军在中间，德意志军殿后。", "他们占住了河岸和水源，守军和民兵被逼退到城墙下。"]}}, {"id": "p2", "time": "7月25—26日", "title": "守军在果园里层层设防，援军的消息传来", "desc": "果园里到处是围墙和沟渠，守军在每一道墙后抵抗，十字军推进很慢。\n\n这几天里，城里不断向周边求援。努尔丁和他的兄长赛义夫丁，正带着兵赶来。消息传到十字军营里，许多人开始着急。", "html": "<p><span class=\"sn\" data-i=\"0\">果园里到处是围墙和沟渠，守军在每一道墙后抵抗，十字军推进很慢。</span></p>\n<p><span class=\"sn\" data-i=\"1\">这几天里，城里不断向周边求援。</span><span class=\"sn\" data-i=\"2\">努尔丁和他的兄长赛义夫丁，正带着兵赶来。</span><span class=\"sn\" data-i=\"3\">消息传到十字军营里，许多人开始着急。</span></p>", "speech": {"key": "b:damascus:2", "sentences": ["果园里到处是围墙和沟渠，守军在每一道墙后抵抗，十字军推进很慢。", "这几天里，城里不断向周边求援。", "努尔丁和他的兄长赛义夫丁，正带着兵赶来。", "消息传到十字军营里，许多人开始着急。"]}}, {"id": "p3", "time": "7月27日", "title": "十字军把营地移到城东南的平地，却丢了水和遮蔽", "desc": "7月27日，十字军的首领们决定换个方向。据说他们认为城东南的城墙更薄弱。于是全军移营，从果园撤到了城东南的平地。\n\n可是那里没有水，也没有树荫。守军趁机重新占据果园，封住了他们回头的路。", "html": "<p><span class=\"sn\" data-i=\"0\">7月27日，十字军的首领们决定换个方向。</span><span class=\"sn\" data-i=\"1\">据说他们认为城东南的城墙更薄弱。</span><span class=\"sn\" data-i=\"2\">于是全军移营，从果园撤到了城东南的平地。</span></p>\n<p><span class=\"sn\" data-i=\"3\">可是那里没有水，也没有树荫。</span><span class=\"sn\" data-i=\"4\">守军趁机重新占据果园，封住了他们回头的路。</span></p>", "speech": {"key": "b:damascus:3", "sentences": ["7月27日，十字军的首领们决定换个方向。", "据说他们认为城东南的城墙更薄弱。", "于是全军移营，从果园撤到了城东南的平地。", "可是那里没有水，也没有树荫。", "守军趁机重新占据果园，封住了他们回头的路。"]}}, {"id": "p4", "time": "7月28日", "title": "没有水、没有粮，又听说援军将至，十字军决定撤退", "desc": "7月28日，十字军发现营地缺水缺粮，而对手的援军就要到了。首领们决定放弃围攻。\n\n撤退的队伍向西南走，一路被城里出来的骑射手追着放箭。三支军队都没有再回头。", "html": "<p><span class=\"sn\" data-i=\"0\">7月28日，十字军发现营地缺水缺粮，而对手的援军就要到了。</span><span class=\"sn\" data-i=\"1\">首领们决定放弃围攻。</span></p>\n<p><span class=\"sn\" data-i=\"2\">撤退的队伍向西南走，一路被城里出来的骑射手追着放箭。</span><span class=\"sn\" data-i=\"3\">三支军队都没有再回头。</span></p>", "speech": {"key": "b:damascus:4", "sentences": ["7月28日，十字军发现营地缺水缺粮，而对手的援军就要到了。", "首领们决定放弃围攻。", "撤退的队伍向西南走，一路被城里出来的骑射手追着放箭。", "三支军队都没有再回头。"]}}], "terrain": "大马士革在叙利亚内陆，城西是一片靠河水灌溉的果园和沟渠，名叫古塔绿洲；城东南则是开阔的平地。\n\n果园对攻守双方都有用：攻方靠它取水，守方靠它遮蔽、设伏。谁占着果园，谁就占着水。", "outcome": "十字军只围了四天就撤了。大马士革的盟约被撕毁，耶路撒冷王国失去了一个重要的盟友。\n\n当时的记载里，有人说守军用金钱收买了某些贵族，也有人说各方在拿下城之后由谁统治的问题上吵了起来。这些说法不能全信。更稳妥的结论是：他们没有足够的补给，也没有时间。\n\n后来，努尔丁在1154年进入大马士革，叙利亚的穆斯林势力连成了一片。", "strength_note": "各种记载对兵力说法不一，本图不画兵力。", "confidence": "medium", "sources": [{"kind": "external", "ref": "提尔的威廉《海外编年史》（当时的耶路撒冷王国记载）"}, {"kind": "external", "ref": "Jonathan Phillips，The Second Crusade（2007）"}], "needs_check": ["各营地的具体位置为推定。", "移营的原因，不同记载说法不同：认为城东南城墙薄弱，只是其中一种解释。", "巴拉达河与果园的边界为推定。"], "terrainHtml": "<p><span class=\"sn\" data-i=\"0\">大马士革在叙利亚内陆，城西是一片靠河水灌溉的果园和沟渠，名叫古塔绿洲；</span><span class=\"sn\" data-i=\"1\">城东南则是开阔的平地。</span></p>\n<p><span class=\"sn\" data-i=\"2\">果园对攻守双方都有用：攻方靠它取水，守方靠它遮蔽、设伏。</span><span class=\"sn\" data-i=\"3\">谁占着果园，谁就占着水。</span></p>", "outcomeHtml": "<p><span class=\"sn\" data-i=\"0\">十字军只围了四天就撤了。</span><span class=\"sn\" data-i=\"1\">大马士革的盟约被撕毁，耶路撒冷王国失去了一个重要的盟友。</span></p>\n<p><span class=\"sn\" data-i=\"2\">当时的记载里，有人说守军用金钱收买了某些贵族，也有人说各方在拿下城之后由谁统治的问题上吵了起来。</span><span class=\"sn\" data-i=\"3\">这些说法不能全信。</span><span class=\"sn\" data-i=\"4\">更稳妥的结论是：他们没有足够的补给，也没有时间。</span></p>\n<p><span class=\"sn\" data-i=\"5\">后来，努尔丁在1154年进入大马士革，叙利亚的穆斯林势力连成了一片。</span></p>", "speech0": {"key": "b:damascus:0", "sentences": ["大马士革在叙利亚内陆，城西是一片靠河水灌溉的果园和沟渠，名叫古塔绿洲；", "城东南则是开阔的平地。", "果园对攻守双方都有用：攻方靠它取水，守方靠它遮蔽、设伏。", "谁占着果园，谁就占着水。"]}, "speechN": {"key": "b:damascus:5", "sentences": ["十字军只围了四天就撤了。", "大马士革的盟约被撕毁，耶路撒冷王国失去了一个重要的盟友。", "当时的记载里，有人说守军用金钱收买了某些贵族，也有人说各方在拿下城之后由谁统治的问题上吵了起来。", "这些说法不能全信。", "更稳妥的结论是：他们没有足够的补给，也没有时间。", "后来，努尔丁在1154年进入大马士革，叙利亚的穆斯林势力连成了一片。"]}, "_img": {"src": "crusades/battles/damascus.webp", "bbox": [36.0815, 33.4337, 36.3185, 33.5663], "w": 2200, "h": 1476, "credit": "卫星影像：Copernicus Sentinel-2 L2A（2024-12-25），约 10 米/像素"}}], "_stages": null}];

const AUDIO = {"second-crusade/s:edessa": {"src": "crusades/audio/f540224735d8.mp3", "dur": 59.976, "cues": [[0.0, 4.152, "1099年，第一次十字军攻下耶路撒冷。"], [4.296, 13.896, "此后东方出现了四个拉丁人的国家：耶路撒冷王国、安条克公国、的黎波里伯国，还有最靠北的埃德萨伯国。"], [14.04, 23.136, "埃德萨在幼发拉底河以东，夹在叙利亚和两河流域之间，是四个国家里位置最突出、也最孤立的一个。"], [23.28, 28.392, "1144年，摩苏尔和阿勒颇的统治者赞吉看准了机会。"], [28.536, 34.272, "埃德萨伯爵若瑟林二世带着主力离开了城，城里防守空虚。"], [34.416, 38.16, "赞吉围城约四周，12月24日破城。"], [38.304, 42.144, "城里的拉丁居民遭到洗劫，不少人被杀。"], [42.288, 47.952, "可是赞吉很快下令停手，他要把这座城留下来当自己的据点。"], [48.096, 54.912, "消息传到西欧，人们第一次意识到：第一次十字军打下来的东西，是可能丢掉的。"], [55.056, 59.832, "所以呢：埃德萨陷落，是第二次十字军的直接起因。"]]}, "second-crusade/s:call": {"src": "crusades/audio/593b054e4828.mp3", "dur": 59.4, "cues": [[0.0, 6.768, "教皇尤金三世在1145年底发出诏书，号召西欧再组织一次十字军。"], [6.912, 10.752, "回应最积极的，是法兰西国王路易七世。"], [10.896, 12.792, "他本来就想去。"], [12.936, 21.912, "1143年他攻打香槟时，士兵烧了维特里的一座教堂，躲在里面的许多百姓被烧死，他一直为此愧疚。"], [22.056, 30.336, "1146年复活节，3月31日，克莱尔沃修道院的院长伯尔纳，在韦兹莱的山坡上当众布道。"], [30.48, 36.912, "路易七世带头接过十字架，听的人纷纷挤上来领取缝在衣服上的十字。"], [37.056, 40.248, "伯尔纳接着去德意志巡回布道。"], [40.392, 43.848, "德意志国王康拉德三世起初不肯。"], [43.992, 49.416, "12月下旬，他在施派尔听了伯尔纳的话，也接受了十字架。"], [49.56, 53.208, "这样，两位国王都要亲自带兵出征。"], [53.352, 59.256, "所以呢：这一次不再是各地诸侯零散出发，而是两个王国的大军。"]]}, "second-crusade/s:roads": {"src": "crusades/audio/19d4f6d3d7d4.mp3", "dur": 47.16, "cues": [[0.0, 3.24, "出发前，两位国王都选了陆路。"], [3.384, 11.88, "康拉德先走：1147年5月，他的军队从雷根斯堡出发，顺着多瑙河往下游走，穿过匈牙利。"], [12.024, 17.64, "路易七世晚了大约一个月，从梅斯动身，沿同一条路线跟上去。"], [17.784, 21.264, "王后阿基坦的埃莉诺也随军同行。"], [21.408, 28.344, "匈牙利国王盖佐二世和康拉德并不友好，不过两支军队还是平安通过了。"], [28.488, 33.912, "再往前是保加利亚和色雷斯，已经是拜占庭皇帝的地盘。"], [34.056, 40.296, "人多的大军沿途要吃要住，和当地人的摩擦从这里开始增多。"], [40.44, 47.016, "所以呢：走陆路花钱少，却要穿过别人的国土，这是后来许多麻烦的源头。"]]}, "second-crusade/s:fronts": {"src": "crusades/audio/cb370e29be6a.mp3", "dur": 58.56, "cues": [[0.0, 3.264, "第二次十字军并不只有东方一路。"], [3.408, 7.608, "东边是两位国王的主力，目标是叙利亚。"], [7.752, 11.808, "北边，萨克森等地的诸侯不想走那么远。"], [11.952, 16.008, "教皇同意他们去讨伐北方的异教徒文德人。"], [16.152, 18.816, "这一路几乎没有什么成果。"], [18.96, 28.056, "西边，一支由英格兰、佛兰德尔和莱茵兰人组成的舰队，春末从英格兰起航，途中在葡萄牙靠岸。"], [28.2, 34.152, "葡萄牙国王阿方索·恩里克斯请他们帮忙，攻打穆斯林手里的里斯本。"], [34.296, 39.144, "围城从7月1日开始，10月24日，里斯本投降。"], [39.288, 42.672, "这座城从此成了葡萄牙的城市。"], [42.816, 49.848, "同一个10月，卡斯蒂利亚国王在热那亚人的帮助下，夺取了南方的港口阿尔梅里亚。"], [49.992, 58.416, "所以呢：在整个第二次十字军里，里斯本和阿尔梅里亚是少数真正得手的地方，而且都不在东方。"]]}, "second-crusade/s:constantinople": {"src": "crusades/audio/d4bbd88982e8.mp3", "dur": 51.888, "cues": [[0.0, 4.68, "拜占庭皇帝曼努埃尔一世对这支大军心情复杂。"], [4.824, 12.624, "他同样信基督，可是他也记得，第一次十字军的拉丁人曾给他的祖父留下过不少麻烦。"], [12.768, 18.984, "康拉德的军队一路上不断和当地人起摩擦，到了城外还发生过冲突。"], [19.128, 23.496, "曼努埃尔希望他们尽快渡海，不要在城下久留。"], [23.64, 27.72, "9月下旬，康拉德渡过海峡，进入亚洲。"], [27.864, 33.456, "路易七世10月初到达，在城里受到隆重接待，稍后也渡了海。"], [33.6, 40.464, "曼努埃尔手里还有别的事：西边要提防诺曼人，东边刚和罗姆苏丹达成停战。"], [40.608, 44.376, "他不想因为这些客人，被拖进新的战争。"], [44.52, 51.744, "所以呢：从这里往东，十字军要靠自己在陌生的高原上找路、找水、找粮。"]]}, "second-crusade/s:dorylaeum": {"src": "crusades/audio/fac53f3e621e.mp3", "dur": 33.624, "cues": [[0.0, 3.48, "康拉德渡海之后，没有等路易七世。"], [3.624, 11.376, "他带着主力走内陆路线，从尼西亚出发，朝东南穿过小亚细亚，想直接去叙利亚。"], [11.52, 16.392, "拜占庭派给他们的向导，带他们走进了缺水的高原。"], [16.536, 20.088, "罗姆苏丹国的骑兵早就盯着这支队伍。"], [20.232, 24.864, "这一仗，没有正面会战，只有一整天的袭扰和追杀。"], [25.008, 27.6, "接下来，看战役详图。"], [27.744, 33.48, "所以呢：这一仗之后，德意志军队只剩残部，康拉德只好折回。"]]}, "second-crusade/s:cadmus": {"src": "crusades/audio/e54c9e2bf91d.mp3", "dur": 32.784, "cues": [[0.0, 3.624, "康拉德生病，回了君士坦丁堡休养。"], [3.768, 10.704, "路易七世带着法军沿爱琴海岸往南，先到以弗所，再向东南走到劳迪塞亚。"], [10.848, 15.24, "1148年1月初，军队开始翻越卡德摩斯山。"], [15.384, 19.44, "山路很窄，一边是峭壁，一边是深沟。"], [19.584, 23.472, "这一仗，国王自己就在最危险的地方。"], [23.616, 26.208, "接下来，看战役详图。"], [26.352, 32.64, "所以呢：这一仗之后，法军的行军方式变了，改由圣殿骑士负责组织。"]]}, "second-crusade/s:attalia": {"src": "crusades/audio/18265b278ed6.mp3", "dur": 69.624, "cues": [[0.0, 6.456, "法军沿海岸又走了三个星期，一路被土耳其骑兵骚扰，粮食越来越少。"], [6.6, 12.504, "1月底，他们到达拜占庭的海港阿塔利亚，也就是今天的安塔利亚。"], [12.648, 15.528, "他们本来想乘船去叙利亚。"], [15.672, 19.848, "可是港里的船远远不够，价钱又涨得厉害。"], [19.992, 28.656, "路易七世只好带着王后、贵族和骑士先走，步兵和朝圣者留在原地，继续走陆路或者等船。"], [28.8, 32.088, "留下的人，大多没能走到叙利亚。"], [32.232, 36.648, "3月19日，路易七世终于在安条克的港口登岸。"], [36.792, 42.36, "安条克亲王雷蒙德，正是埃莉诺的叔叔，他迎接得极为热情。"], [42.504, 47.232, "雷蒙德希望路易先去打阿勒颇，夺回北方的主动权。"], [47.376, 51.024, "路易却一心要先去耶路撒冷朝圣。"], [51.168, 55.488, "埃莉诺站在叔叔这边，夫妻关系也在这里变坏。"], [55.632, 60.84, "据当时的记载，路易最后是半夜带着她离开安条克的。"], [60.984, 69.48, "所以呢：北方诸国要的是收复埃德萨一带，远征军想要的是耶路撒冷，两边的目标从这里错开了。"]]}, "second-crusade/s:acre": {"src": "crusades/audio/0090aff61cf3.mp3", "dur": 50.712, "cues": [[0.0, 5.424, "康拉德在春天乘船到了阿克，路易七世也到了耶路撒冷。"], [5.568, 13.296, "耶路撒冷的年轻国王鲍德温三世和他的母亲、女王梅丽桑德，在阿克召开了一次大会。"], [13.44, 21.648, "6月24日的这次会议上，大家决定去打大马士革，而不是去收复埃德萨，也不是去打阿勒颇。"], [21.792, 29.52, "理由很直接：大马士革离耶路撒冷近，又是一座富庶的大城，拿下来能巩固王国的北边。"], [29.664, 35.256, "可是大马士革的实际掌权者乌努尔，正是耶路撒冷多年的盟友。"], [35.4, 39.384, "1140年，他们订过盟约，一起对付赞吉。"], [39.528, 44.352, "于是十字军把一个盟友，推到了真正的对手那一边。"], [44.496, 50.568, "所以呢：后来的史家大多认为，第二次十字军的方向，是在这里选错的。"]]}, "second-crusade/s:damascus": {"src": "crusades/audio/5ea420aca20a.mp3", "dur": 34.824, "cues": [[0.0, 5.976, "1148年7月23日，三支军队抵达大马士革城西的古塔绿洲。"], [6.12, 11.928, "耶路撒冷国王鲍德温三世带前锋，路易七世居中，康拉德殿后。"], [12.072, 15.288, "古塔绿洲是一片果园和沟渠。"], [15.432, 21.048, "有水，有树，对攻方是个好营地，对守方也一样方便设伏。"], [21.192, 27.6, "接下来四天，这座城的命运，在果园、河岸和一次移营之间被决定。"], [27.744, 29.688, "看战役详图。"], [29.832, 34.68, "所以呢：这一仗之后，十字军再也没有集合起这样的力量。"]]}, "second-crusade/s:aftermath": {"src": "crusades/audio/8fc731104fd5.mp3", "dur": 47.832, "cues": [[0.0, 5.88, "大马士革之围失败后，康拉德在1148年9月离开，回到德意志。"], [6.024, 10.296, "路易七世又留了几个月，1149年才回国。"], [10.44, 16.8, "1149年6月，努尔丁在伊纳卜打败了安条克的雷蒙德，雷蒙德战死。"], [16.944, 23.52, "1154年，努尔丁进入大马士革，叙利亚的穆斯林势力第一次连成一片。"], [23.664, 29.736, "三十多年后，埃及的萨拉丁沿着这条路继续走下去，夺回了耶路撒冷。"], [29.88, 33.264, "伯尔纳因为这次失败受到许多批评。"], [33.408, 37.392, "他自己的解释是：罪在十字军自己的罪孽。"], [37.536, 42.672, "所以呢：第二次十字军没有收复埃德萨，还失去了一个盟友。"], [42.816, 47.688, "它真正的后果，是让穆斯林一方有了联合起来的理由。"]]}, "second-crusade/b:dorylaeum:0": {"src": "crusades/audio/f75697841fbc.mp3", "dur": 19.128, "cues": [[0.0, 6.696, "多利莱乌姆在小亚细亚西北部的高原边缘，是从尼西亚去内地的必经之地。"], [6.84, 9.672, "这里地势开阔，水源稀少。"], [9.816, 18.984, "熟悉地形的罗姆骑射手，可以在开阔地上来去自如，而不熟悉地形的远征军，容易被拉成一条长线。"]]}, "second-crusade/b:dorylaeum:1": {"src": "crusades/audio/14d708556fec.mp3", "dur": 16.8, "cues": [[0.0, 5.376, "德意志军离开尼西亚后，沿着通向内地的大道往东南走。"], [5.52, 10.08, "骑士走在前面，步行的朝圣者和辎重落在后面。"], [10.224, 13.152, "高原上水源少，路又长。"], [13.296, 16.656, "队伍越拉越长，前后渐渐连不上。"]]}, "second-crusade/b:dorylaeum:2": {"src": "crusades/audio/d7e0635fab75.mp3", "dur": 17.688, "cues": [[0.0, 3.936, "罗姆苏丹国的骑射手早就守在高原边缘。"], [4.08, 11.064, "他们不和骑士正面相撞，而是从南北两侧轮流冲上来放箭，再迅速退走。"], [11.208, 14.304, "每冲一次，队尾就倒下一批人。"], [14.448, 17.544, "骑士追不上，辎重也丢了不少。"]]}, "second-crusade/b:dorylaeum:3": {"src": "crusades/audio/a1eea533c771.mp3", "dur": 18.168, "cues": [[0.0, 6.312, "德意志骑士无法追上跑得更快的对手，也无法一边保护队尾一边向前。"], [6.456, 8.952, "康拉德只好下令折回。"], [9.096, 13.416, "撤退的路上，罗姆骑射手一直跟在后面袭扰。"], [13.56, 18.024, "德意志军带着伤员和残存的人马，退向尼西亚。"]]}, "second-crusade/b:dorylaeum:4": {"src": "crusades/audio/d05c2ecabdf0.mp3", "dur": 15.168, "cues": [[0.0, 4.2, "德意志军损失惨重，不得不退回尼西亚一带。"], [4.344, 7.416, "康拉德没有再继续走内陆路线。"], [7.56, 15.024, "法国军队随后赶到，两位国王的军队合在一起，改走更长、却更安全的沿海路。"]]}, "second-crusade/b:cadmus:0": {"src": "crusades/audio/d2d362a58dad.mp3", "dur": 15.288, "cues": [[0.0, 5.616, "卡德摩斯山在劳迪塞亚南面，是通往阿塔利亚的必经山路。"], [5.76, 9.816, "山路很窄，一边是峭壁，一边是深沟。"], [9.96, 15.144, "大军只能拉成一条长线前进，前后很难互相照应。"]]}, "second-crusade/b:cadmus:1": {"src": "crusades/audio/2e6670aedcb6.mp3", "dur": 18.48, "cues": [[0.0, 5.16, "国王下令，先头部队翻过山头后要在高处等后队跟上。"], [5.304, 11.712, "可是先头指挥官若弗鲁瓦走过山口，觉得前面地势平缓，就继续往前。"], [11.856, 18.336, "国王和后面的队伍还在山腰，前后越拉越远，中间出现了一大段空隙。"]]}, "second-crusade/b:cadmus:2": {"src": "crusades/audio/094f1419ec3f.mp3", "dur": 19.896, "cues": [[0.0, 3.672, "附近的突厥骑射手早就在山上盯着。"], [3.816, 12.384, "他们看到队伍断开，就从两侧冲下来，占住山头，把辎重和朝圣者组成的后队截在了山路上。"], [12.528, 19.752, "山路窄，一边是峭壁，一边是深沟，人和马挤在一起，既退不回去，也过不去。"]]}, "second-crusade/b:cadmus:3": {"src": "crusades/audio/03a1610a0afa.mp3", "dur": 18.816, "cues": [[0.0, 2.688, "国王身边的卫队被冲散。"], [2.832, 9.504, "据当时的记载，路易七世攀上一块岩壁，背靠它，用剑抵挡冲上来的人。"], [9.648, 14.328, "他没有穿显眼的王袍，对方没有认出这是国王。"], [14.472, 18.672, "后队的朝圣者大多没有这么幸运，纷纷溃散。"]]}, "second-crusade/b:cadmus:4": {"src": "crusades/aud function setupZoom(){

  zoom.extent([[0,0],[w,h]]).scaleExtent([minK, minK*18]).translateExtent([[0,0],[GEO.W,GEO.H]]);

}
setupZoom();
function viewTransform(v){
  const w = wrapEl.clientWidth, h = wrapEl.clientHeight;
  const fitK = Math.min(w/GEO.W, h/GEO.H);       // 缩放 1 = 整张图塞进窗口
  const [x,y] = v ? lonlat(v[0],v[1]) : lonlat(137.5, 37.2);
  const k = Math.max(fitK*(v ? v[2] : 1.15), Math.max(w/GEO.W, h/GEO.H));

    mkG.selectAll('.mk').each(function(d){ const r=8/s; placed.push({x:d.x-r, y:d.y-r, width:2*r, height:2*r}); });
    mkG.selectAll('.mk').each(function(d){
      const tx = d3.select(this).select('text'); const o = 12/s;
      const opts = [[d.x+o, d.y, 'start'], [d.x-o, d.y, 'end'], [d.x, d.y-o-5/s, 'middle'], [d.x, d.y+o+6/s, 'middle']];
      let ok = false;
      for (const [x,y,a] of opts) { tx.attr('x',x).attr('y',y).attr('text-anchor',a); const b=this.querySelector('text').getBBox(); if (!hits(b)) { placed.push(b); ok=true; break; } }
      if (!ok) tx.attr('x',d.x+o).attr('y',d.y).attr('text-anchor','start');

    });
  }
  if (vis(routeG)) routeG.selectAll('.rlab').each(function(d){
    const L = d.node.getTotalLength(); let ok = false;
    for (const f of [.5,.38,.62,.26,.74,.15,.85]) {
      const q = d.node.getPointAtLength(L*f); this.setAttribute('x', q.x); this.setAttribute('y', q.y - 9/s);
      const b = this.getBBox(); if (!hits(b)) { placed.push(b); ok = true; break; }
    }
    this.style.opacity = ok ? 1 : 0;
  });
  if (vis(flabG)) flabG.selectAll('text').filter(function(){ return this.getAttribute('display')!=='none'; }).sort((a,b)=>b.area-a.area).each(function(){
    const b = this.getBBox(); const hit = hits(b); this.style.opacity = hit ? 0 : 1; if (!hit) placed.push(b);
  });
  if (vis(plabG)) plabSel.each(function(d){
    if (Math.sqrt(d[1].area)*s < 30) return;
    const b = this.getBBox(); const hit = hits(b); this.style.opacity = hit ? 0 : null; if (!hit) placed.push(b);
  });
  if (vis(cityG)) {   // 现代城市：优先级最低，让给历史标注、势力名和国名；方块被压住就整个隐藏，名字放不下就只留方块
    cityG.selectAll('.city').each(function(d){
      const r = 6/s, sq = {x:d.x-r, y:d.y-r, width:2*r, height:2*r}, tx = d3.select(this).select('text'), o = 9/s;
      if (hits(sq)) { d3.select(this).style('opacity', 0); return; }
      d3.select(this).style('opacity', null); placed.push(sq);
      let ok = false;
      for (const [x,y,a] of [[d.x+o,d.y,'start'],[d.x-o,d.y,'end'],[d.x,d.y+o+5/s,'middle'],[d.x,d.y-o-5/s,'middle']]) { tx.attr('x',x).attr('y',y).attr('text-anchor',a); const b=this.querySelector('text').getBBox(); if (!hits(b)) { placed.push(b); ok=true; break; } }
      tx.style('opacity', ok ? 1 : 0);
    });
  }
}

/* ---------- state ---------- */
// 每章的阶段：数据里的 stages，若有 timeline 则在最后追加一个“时间线”阶段
for (const C of CHAPTERS) {
  C._stages = C.stages.slice();
  if ((C.timeline||[]).length) C._stages.push({id:'timeline', when: C.when, title:'时间线', _timeline:true, markers: C.markers.map(m=>m.id)});
}
let ci = 0, si = 0, assignMap = {}, notesMap = {}, selBlk = null, legendLock = null;
const CH = () => CHAPTERS[ci], ST = () => CH()._stages[si];
const curView = () => ST().view || CH().view || null;
function fillOf(C, fid){ const f=C.factions[fid]; return f.hatch ? `url(#hatch-${fid})` : f.color; }
function darker(hex, k=0.55){ const c=d3.color(hex); return d3.rgb(c.r*k, c.g*k, c.b*k).formatHex(); }
function buildPatterns(C){
  defs.selectAll('pattern').remove();
  for (const [fid,f] of Object.entries(C.factions)) if (f.hatch) {
    const p = defs.append('pattern').attr('id',`hatch-${fid}`).attr('patternUnits','userSpaceOnUse').attr('width',14).attr('height',14).attr('patternTransform','rotate(45)');
    p.append('rect').attr('width',14).attr('height',14).attr('fill',d3.color(f.color).brighter(0.6));
    p.append('rect').attr('width',5).attr('height',14).attr('fill',f.color);
  }
}
function go(c, s, opts={}){
  const chChanged = c !== ci || opts.first;
  ci = Math.max(0, Math.min(CHAPTERS.length-1, c));
  const C = CH();
  si = Math.max(0, Math.min(C._stages.length-1, s));
  const S = ST();
  const SM = S._timeline ? {} : (S.map||{});
  assignMap = {}; notesMap = {...(C.map.notes||{}), ...(SM.notes||{})};
  const def = SM.default || C.map.default;
  for (const id of BIDS) assignMap[id] = def;
  for (const src of [C.map.assign||{}, SM.assign||{}]) for (const [fid, str] of Object.entries(src)) for (const id of expand(str)) assignMap[id] = fid;
  if (chChanged) buildPatterns(C);
  legendLock = null; blocksG.classed('dim', false); blkSel.classed('hl', false);
  blkSel.attr('fill', id => fillOf(C, assignMap[id]));
  drawFactionLabels(C);
  drawMarkers(C, S);
  drawRoutes(C, S);
  renderLegend(C);
  renderLegendSymbols(C, S);
  renderPanel(C, S);
  renderBattleLinks(C, S);
  if (BV.open) closeBattle();
  if (selBlk) showSelTip();
  d3.selectAll('.tl-dot').classed('on', (d,j)=> j===ci).attr('aria-current', (d,j)=> j===ci ? 'true' : null);
  if (typeof layoutTL==='function') layoutTL();
  document.getElementById('prev').disabled = ci===0 && si===0;
  document.getElementById('next').disabled = ci===CHAPTERS.length-1 && si===C._stages.length-1;
  if (!opts.keepView) goView(curView(), opts.instant);
  if (!opts.noHash) { try { history.replaceState(null,'','#'+C.id+(C._stages.length>1?'.'+S.id:'')); } catch(e){} }
  store(CFG.prefix+'-pos', C.id+'.'+S.id);
  applyLabelSizes();
}
function step(dir){
  const C = CH();
  if (dir>0) { if (si < C._stages.length-1) go(ci, si+1); else if (ci < CHAPTERS.length-1) go(ci+1, 0); }
  else { if (si > 0) go(ci, si-1); else if (ci > 0) go(ci-1, CHAPTERS[ci-1]._stages.length-1); }
}

/* 势力名：位置只按“当前视野内可见的那部分领土”来求，整段文字保持在可见区域内，并避开右上角标题与头像、右下角图例与按钮、左上角按钮。 */
const CELL = 8; let CELLS = null;   // 每个分区栅格化成间隔 CELL 个地图单位的采样点，用来求“可见部分”的重心
function blockCells(){
  if (CELLS) return CELLS;
  const cw = Math.ceil(GEO.W/CELL), chh = Math.ceil(GEO.H/CELL);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = chh;
  const g = cv.getContext('2d', {willReadFrequently:true}); g.scale(1/CELL, 1/CELL);
  BIDS.forEach((id,i) => { const n = i+1; g.fillStyle = `rgb(${n>>8},${n&255},0)`; g.fill(new Path2D(B[id].d)); });
  const data = g.getImageData(0,0,cw,chh).data, tmp = BIDS.map(()=>[]);
  for (let j=0;j<chh;j++) for (let i=0;i<cw;i++){ const o=(j*cw+i)*4; if (data[o+3]!==255) continue; const n=(data[o]<<8)|data[o+1]; if (n>=1 && n<=BIDS.length) tmp[n-1].push((i+.5)*CELL, (j+.5)*CELL); }
  CELLS = new Map(BIDS.map((id,i) => [id, tmp[i]]));
  return CELLS;
}
let FL = [];
function drawFactionLabels(C){
  const comps = []; const seen = new Set();
  for (const u of BIDS) {
    if (seen.has(u)) continue; const fid = assignMap[u];
    const stack=[u], comp=[]; seen.add(u);
    while (stack.length){ const v=stack.pop(); comp.push(v); for (const w of GEO.adj[v]) if (!seen.has(w) && assignMap[w]===fid){ seen.add(w); stack.push(w);} }
    comps.push({fid, units:comp});
  }
  const cells = blockCells(), labels = [];
  for (const [fid, cs] of d3.group(comps, c=>c.fid)) {
    if (['other','neutral'].includes(fid)) continue;
    cs.forEach(c => c.area = d3.sum(c.units, u=>B[u].area));
    cs.sort((a,b)=>b.area-a.area);
    cs.forEach((c, idx) => {
      if (idx>2 || (idx>0 && c.area < 40000)) return;
      let pts = [];
      for (const u of c.units) { const a = cells.get(u); if (a && a.length) for (let k=0;k<a.length;k++) pts.push(a[k]); else pts.push(B[u].lx, B[u].ly); }
      const stride = Math.max(1, Math.ceil(pts.length/2/6000)); if (stride>1) { const q=[]; for (let k=0;k<pts.length;k+=2*stride) q.push(pts[k],pts[k+1]); pts=q; }
      const name = C.factions[fid].name.replace(/（.*?）/,'');
      const em = [...name].reduce((s,ch)=> s + (/[⺀-鿿＀-￯]/.test(ch) ? 1 : .6) + .08, 0);   // 估算一个字号下的文字宽度（含字间距）
      labels.push({key:fid+'#'+idx, fid, name, em, color:darker(C.factions[fid].color, 0.6), area:c.area, pts:Float32Array.from(pts), stride, x:0, y:0});
    });
  }
  FL = labels;
  flabG.selectAll('text').data(labels, d=>d.key).join('text').attr('class','flab').attr('fill',d=>d.color).text(d=>d.name);
}
function labelForbidden(wr){
  const out = [], pad = 8;
  const add = el => { if (!el) return; const r = el.getBoundingClientRect(); if (r.width < 2 || r.height < 2) return; out.push({l:r.left-wr.left-pad, t:r.top-wr.top-pad, r:r.right-wr.left+pad, b:r.bottom-wr.top+pad}); };
  document.querySelectorAll('#mapcard .era,#mapcard h2,#mapcard .lead,#mapcard .people,#layers-btn,#layers-group,#legend-btn,#legend,#blinks button,#help-btn,#helpcard').forEach(add);
  return out;
}
function placeFactionLabels(T){
  if (!FL.length || !T) return;
  const w = wrapEl.clientWidth, h = wrapEl.clientHeight, k = T.k, M = 10, wr = wrapEl.getBoundingClientRect(), forb = labelForbidden(wr);
  const overlap = (a, f) => Math.max(0, Math.min(a.r,f.r)-Math.max(a.l,f.l)) * Math.max(0, Math.min(a.b,f.b)-Math.max(a.t,f.t));
  const mks = mkG.attr('display')==='none' ? [] : mkG.selectAll('.mk').data().map(m => { const x = m.x*k+T.x, y = m.y*k+T.y; return {l:x-14, r:x+14, t:y-14, b:y+14}; });
  const sel = flabG.selectAll('text');
  // 小势力先放（它们的位置受限），大势力再绕开已放好的名字
  for (const node of sel.nodes().sort((a,b) => d3.select(a).datum().area - d3.select(b).datum().area)) {
    const L = d3.select(node).datum(), nodeSel = d3.select(node);
    // 1. 可见部分的采样点
    const vis = []; let sx=0, sy=0;
    for (let i=0;i<L.pts.length;i+=2) { const x = L.pts[i]*k+T.x, y = L.pts[i+1]*k+T.y; if (x>=M && x<=w-M && y>=M && y<=h-M) { vis.push(x,y); sx+=x; sy+=y; } }
    if (!vis.length) { nodeSel.attr('display','none'); continue; }
    nodeSel.attr('display', null);
    // 2. 字号（屏幕像素），文字过宽时缩小
    let fs = Math.min(26, 13 + Math.sqrt(L.area)*k/14);
    const maxW = (w-2*M)*.9; if (L.em*fs > maxW) fs = Math.max(11, maxW/L.em);
    const bw = L.em*fs + 8, bh = fs*1.35 + 6;
    // 3. 理想位置：可见部分的重心（离领土太远就取最近的领土点）
    const n = vis.length/2; let cx = sx/n, cy = sy/n + 30*k, bestD = 1e18, bx = cx, by = cy;
    for (let i=0;i<vis.length;i+=2) { const d = (vis[i]-cx)**2 + (vis[i+1]-cy)**2; if (d<bestD) { bestD=d; bx=vis[i]; by=vis[i+1]; } }
    if (Math.sqrt(bestD) > CELL*k*1.5) { cx = bx; cy = by; }
    // 4. 候选位置：重心 + 领土上的若干点；整个文字框夹进可见区域，并扣掉与界面元素重叠
    const clampX = x => Math.max(M+bw/2, Math.min(w-M-bw/2, x)), clampY = y => Math.max(M+bh/2, Math.min(h-M-bh/2, y));
    const box = (x,y) => ({l:x-bw/2, r:x+bw/2, t:y-bh/2, b:y+bh/2});
    // 文字框盖住的领土越多越好（放在领土的“主体”上，而不是几块领土之间的空隙里）；压到界面元素是硬性禁止，压到历史标注的符号扣分
    const need = bw*bh/((CELL*k)**2*L.stride);
    const cover = (x,y) => { let c = 0; const l=x-bw/2, r=x+bw/2, t0=y-bh/2, b0=y+bh/2; for (let i=0;i<vis.length;i+=2) if (vis[i]>=l && vis[i]<=r && vis[i+1]>=t0 && vis[i+1]<=b0) c++; return Math.min(1, c/need); };
    const cost = (x,y,qx,qy,cov) => { const bb = box(x,y); let ov = 0; for (const f of forb) ov += overlap(bb,f); let mk = 0; for (const m of mks) if (overlap(bb,m)>0) mk++;
      return (ov>0 ? 1e6+ov : 0) + mk*250 + (cov===null ? 150 : (1-cov)*400) + .25*Math.hypot(x-cx,y-cy) + 3*Math.hypot(x-qx,y-qy); };
    let best = null;
    const tryAt = (qx,qy,dx=0,dy=0) => { const x = clampX(qx+dx), y = clampY(qy+dy), c = cost(x,y,qx+dx,qy+dy, dx||dy ? null : cover(x,y)); if (!best || c<best.c) best = {x,y,c}; };
    tryAt(cx, cy);
    const step = Math.max(2, Math.floor(n/80));
    for (let i=0;i<n;i+=step) tryAt(vis[2*i], vis[2*i+1]);
    if (best.c >= 1e6) {   // 领土上放不下：围绕几个领土点向外找空位
      const s2 = Math.max(1, Math.floor(n/12));
      for (let i=0;i<n;i+=s2) for (let dx=-240; dx<=240; dx+=40) for (let dy=-200; dy<=200; dy+=40) tryAt(vis[2*i], vis[2*i+1], dx, dy);
    }
    L.x = (best.x - T.x)/k; L.y = (best.y - T.y)/k;
    nodeSel.attr('x', L.x).attr('y', L.y).attr('font-size', fs/curK);
    const bb = box(best.x, best.y); forb.push({l:bb.l-4, r:bb.r+4, t:bb.t-3, b:bb.b+3});
  }
}

const SYM = {
  capital: g => { g.append('circle').attr('r',8).attr('fill','#b5432f'); g.append('circle').attr('r',3.2).attr('fill','#fff').attr('stroke','none'); },
  castle: g => g.append('rect').attr('x',-6).attr('y',-6).attr('width',12).attr('height',12).attr('fill','#2f4d74'),
  battle: g => { g.append('circle').attr('r',8).attr('fill','#1d1a16'); g.append('path').attr('d','M-4,-4L4,4M4,-4L-4,4').attr('stroke','#fff').attr('stroke-width',1.8); },
  city: g => g.append('circle').attr('r',6).attr('fill','#6b5a3e'),
};
const SYM_LABEL = {capital:'都城·政权中心', castle:'城郭·据点', battle:'战役·事件', city:'城市·地点'};
const stageMarkers = (C,S) => S.markers ? S.markers.map(id => C.markers.find(m=>m.id===id)).filter(Boolean) : C.markers;
function drawMarkers(C, S){
  const data = stageMarkers(C,S).map(m=>{ const [x,y]=lonlat(m.lon,m.lat); return {...m,x,y}; });
  mkG.selectAll('.mk').remove();
  const g = mkG.selectAll('.mk').data(data).join('g').attr('class','mk').attr('tabindex',0).attr('role','button').attr('aria-label',d=>`${d.name}，点击复制注释`);
  g.each(function(d){ const s=d3.select(this).append('g').attr('class','sym'); SYM[d.type](s); });
  g.append('text').text(d=>d.name);
  g.on('mouseenter focus', (e,d)=> showMarkerTip(d)).on('mouseleave blur', hideTip)
   .on('click', (e,d)=>{ e.stopPropagation(); copyMarker(d); })
   .on('keydown', (e,d)=>{ if (e.key==='Enter') copyMarker(d); });
}
function copyMarker(d){
  const text = `${d.name}${d.year?`（${d.year}）`:''}：${d.desc}`;
  const done = ok => toast(ok ? '已复制注释' : '复制失败，请手动选择');
  try { navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(fallbackCopy(text))); } catch(e){ done(fallbackCopy(text)); }
}
function fallbackCopy(text){ try { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; } }
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0, 1400); }
function drawRoutes(C, S){
  routeG.selectAll('*').remove();
  const rs = (S.routes||[]).map(id => (C.routes||[]).find(r=>r.id===id)).filter(Boolean);
  const line = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
  for (const r of rs) {
    const pts = r.points.map(p=>lonlat(p[0],p[1]));
    routeG.append('path').attr('class','route-halo').attr('data-id', r.id).attr('d', line(pts));
    const path = routeG.append('path').attr('class','route').attr('data-id', r.id).attr('d', line(pts)).attr('stroke', r.color||'#2f5f9e').attr('marker-end','url(#arrow)');
    routeG.append('text').datum({node: path.node(), id: r.id}).attr('class','rlab').attr('fill',darker(r.color||'#2f5f9e',0.8)).text(r.label + (r.year?`（${r.year}）`:''));
  }
}

/* ---------- map tooltip ---------- */
const tip = document.getElementById('tip');
function placeTip(x, y){
  const t = d3.zoomTransform(svg.node()); const sx = t.applyX(x), sy = t.applyY(y);
  const r = wrapEl.getBoundingClientRect();
  let left = sx + 14, top = sy + 14;
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (left + tw > r.width - 8) left = sx - tw - 14;
  if (top + th > r.height - 8) top = sy - th - 14;
  tip.style.left = Math.max(8,left)+'px'; tip.style.top = Math.max(8,top)+'px';
}

function blockHTML(id){

function showMarkerTip(d){

blkSel.on('mousemove', (e,id)=>{ const t=d3.zoomTransform(svg.node()); const [px,py]=d3.pointer(e, svg.node()); tip.innerHTML = blockHTML(id); placeTip(t.invertX(px), t.invertY(py)); })

/* ---------- legend (map, bottom-right) ---------- */

const ptipEl = document.getElementById('ptip');
function ptip(el, html, side, wide){
  ptipEl.innerHTML = html; ptipEl.style.opacity = 1; ptipEl.style.maxWidth = wide ? '380px' : '';
  const r = el.getBoundingClientRect(), tw = ptipEl.offsetWidth, th = ptipEl.offsetHeight;

  else { left = r.left + r.width/2 - tw/2; top = r.bottom + 8; }
  left = Math.max(8, Math.min(window.innerWidth - tw - 8, left)); top = Math.max(8, Math.min(window.innerHeight - th - 8, top));

/* ---------- 术语悬停解释 ---------- */
// data/glossary.json：[{term, aliases?, desc}]。每个阶段里每个术语只在第一次出现处加虚线下划线；同一位置优先匹配最长的词；
// 不匹配进标题（h1–h6）、已有链接（a）和 HTML 标签里。
const GL = (() => {
  const list = (Array.isArray(GLOSSARY) ? GLOSSARY : []).filter(g => g && g.term && g.desc), map = new Map();
  list.forEach((g,i) => { for (const w of [g.term, ...(g.aliases||[])]) if (w && !map.has(w)) map.set(w, i); });
  const words = [...map.keys()].sort((a,b) => b.length - a.length);
  return {list, map, re: words.length ? new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'), 'g') : null};
})();
function glossify(html){
  if (!GL.re) return html;
  const used = new Set(); let skip = 0;
  return html.split(/(<[^>]*>)/).map(seg => {
    if (seg[0] === '<') { const m = seg.match(/^<(\/?)(a|h[1-6]|button|script|style)\b/i); if (m) skip = Math.max(0, skip + (m[1] ? -1 : 1)); return seg; }
    if (skip) return seg;
    return seg.replace(GL.re, w => { const i = GL.map.get(w); if (used.has(i)) return w; used.add(i); return `<span class="gl" tabindex="0" data-g="${i}">${w}</span>`; });
  }).join('');
}

    hide = e => { if (e.target.closest && e.target.closest('.gl')) hidePtip(); };
  el.addEventListener('mouseover', show); el.addEventListener('focusin', show); el.addEventListener('mouseout', hide); el.addEventListener('focusout', hide); el.addEventListener('scroll', hidePtip, {passive:true});
}

const ERAS = [['弥生',-300,250,'#e6dccb'],['古坟',250,592,'#dfd3c0'],['飞鸟',592,710,'#e8dcc9'],['奈良',710,794,'#e2d8cf'],['平安',794,1185,'#e9d3c4'],['镰仓',1185,1333,'#d3dde9'],['南北朝',1336,1392,'#e2d6e8'],['室町',1392,1573,'#d6e6d9'],['安土桃山',1573,1603,'#efe2bd'],['江户',1603,1868,'#d9e3df'],['明治',1868,1912,'#ead0cc']];
const Y0 = d3.min(CHAPTERS, c=>c.year) - 15, Y1 = d3.max(CHAPTERS, c=>c.year) + 10;

// 时间轴：长于一屏，可横向滚动。相邻章节的间距按年份比例，但不小于 TL_G（保证年份标签一行放得下）；
// 比例系数取到让总长约为“全部等距”的 1.4 倍，稀疏的年代拉开、密集的年代压到最小间距。
const TL_G = 36, TL_PAD = 24;
let TLX = null;   // year -> px
function tlScale(w){
  const n = CHAPTERS.length, dy = CHAPTERS.slice(1).map((c,i) => c.year - CHAPTERS[i].year);
  const len = k => d3.sum(dy, d => Math.max(TL_G, k*d));
  const target = Math.max(w - 2*TL_PAD, (n-1)*TL_G*1.4);
  let lo = 0, hi = 1;
  while (len(hi) < target && hi < 1e4) hi *= 2;
  for (let it = 0; it < 40; it++) { const k = (lo+hi)/2; if (len(k) > target) hi = k; else lo = k; }
  const px = [TL_PAD]; dy.forEach(d => px.push(px[px.length-1] + Math.max(TL_G, lo*d)));
  const W = Math.max(w, px[n-1] + TL_PAD);
  // 年份 → 像素：在相邻章节之间线性插值，供年代色带使用；两端按同一比例外推
  const ys = [Y0, ...CHAPTERS.map(c=>c.year), Y1], xs = [Math.max(0, px[0] - lo*(CHAPTERS[0].year-Y0)), ...px, Math.min(W, px[n-1] + lo*(Y1-CHAPTERS[n-1].year))];

  return {px, W, gap: d3.min(px.slice(1).map((x,i)=>x-px[i])) ?? 26};

  const R = el => el.getBoundingClientRect();
  const hits = b => placed.some(p => b.left < p.right+pad && b.right+pad > p.left && b.top < p.bottom+pad && b.bottom+pad > p.top);
  bUnitG.selectAll('.bunit rect.box').each(function(){ placed.push(R(this)); });
  bCmdG.selectAll('.bcmd').each(function(){ placed.push(R(this)); });
  bEvG.selectAll('.bev').each(function(){ placed.push(R(this)); });
  const labs = bLabG.selectAll('text').nodes().sort((a,b) => d3.select(a).datum().pri - d3.select(b).datum().pri);
  for (const el of labs) { el.style.opacity = 1; const r = R(el); const hit = hits(r); el.style.opacity = hit ? 0 : 1; if (!hit) placed.push(r); }
}

/* ---- 渐淡着色：12 世纪的内陆疆界本来就不清楚，所以各势力的颜色在交界处渐变过渡，不画硬边界线；海岸线仍然清晰 ----
   做法：在小画布上按分区填色并模糊，再按“陆地被模糊后的不透明度”还原（海岸附近不会变淡）；放大到大画布后按陆地轮廓裁掉海面，
   结果作为一张普通图片叠在地形图上（不用 SVG 裁切：镜头移动时浏览器会偶尔跳过复杂裁切，颜色就闪没了）。
   着色一变（换幕、幕内变化、图例高亮）就重画，新旧两张图交叉淡入。分区本身留在上层，只负责悬停和点选。 */
const SOFT = {sc: .35, out: .75, blur: 9};   // 模糊用的小画布、输出画布相对地图的比例；模糊半径（地图单位，约 14 公里）
const softG = root.insert('g', '.blocks').attr('class', 'softfill');
