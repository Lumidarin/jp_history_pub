<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>历史放映室</title>
<meta name="description" content="在地图上看历史：日本的历史，十字军。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
:root{--ink:#0e0f0f;--paper:#ece6da;--dim:rgba(236,230,218,.62);--line:rgba(236,230,218,.22);--accent:#c9a46a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:"Noto Serif SC","Songti SC","SimSun",serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.top{position:fixed;inset:0 0 auto;z-index:3;display:flex;justify-content:space-between;align-items:baseline;padding:28px clamp(20px,4vw,56px);pointer-events:none}
.brand{font-weight:600;font-size:15px;letter-spacing:.42em}
.top small{font-size:12px;letter-spacing:.3em;color:var(--dim)}
main{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;min-height:100svh}
.entry{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,5vw,72px);isolation:isolate}
.entry+.entry{border-left:1px solid var(--line)}
.entry img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(.55) brightness(.5) contrast(1.05);transform:scale(1.04);transition:filter 1.2s ease,transform 2.4s cubic-bezier(.2,.7,.2,1)}
.entry::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(14,15,15,.92) 0%,rgba(14,15,15,.35) 45%,rgba(14,15,15,.55) 100%)}
.entry:hover img,.entry:focus-visible img{filter:grayscale(0) brightness(.72) contrast(1.05);transform:scale(1)}
.entry:focus-visible{outline:1px solid var(--accent);outline-offset:-12px}
.num{font-size:13px;letter-spacing:.5em;color:var(--accent)}
h2{font-weight:900;font-size:clamp(44px,6.4vw,92px);line-height:1.05;letter-spacing:.06em;margin:18px 0 22px}
.sub{font-size:clamp(15px,1.3vw,18px);line-height:1.8;max-width:26em;color:var(--dim)}
.meta{display:flex;flex-wrap:wrap;gap:0 28px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;letter-spacing:.14em;color:var(--dim)}
.go{margin-left:auto;color:var(--paper);letter-spacing:.3em;transition:letter-spacing .6s ease,color .6s ease}
.go::after{content:" →"}
.entry:hover .go{letter-spacing:.42em;color:var(--accent)}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  .entry{min-height:68svh;padding:28px 20px 32px}
  .entry+.entry{border-left:0;border-top:1px solid var(--line)}
  .entry:first-child{padding-top:88px}
  .top{position:absolute;padding:24px 20px}
  .meta{gap:4px 20px}
  .go{margin-left:0;flex-basis:100%;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){.entry img,.go{transition:none}}
</style>
</head>
<body>
<header class="top"><span class="brand">历史放映室</span><small>在地图上看历史</small></header>
<main>
  <a class="entry" href="japan-power-map.html">
    <img src="covers/japan.webp" alt="" style="object-position:62% 60%">
    <span class="num">第一部</span>
    <h2>日本的历史</h2>
    <p class="sub">从稻作传来到明治宪法，看列岛上的势力如何消长。</p>
    <div class="meta"><span>公元20—1889年</span><span>68 章</span><span>114 场战役</span><span class="go">进入</span></div>
  </a>
  <a class="entry" href="crusades.html">
    <img src="covers/crusades.webp" alt="" style="object-position:60% 70%">
    <span class="num">第二部</span>
    <h2>十字军</h2>
    <p class="sub">第二次十字军：两位国王，一座没攻下的城</p>
    <div class="meta"><span>1144—1154年</span><span>11 幕</span><span>朗读放映</span><span class="go">进入</span></div>
  </a>
</main>
</body>
</html>
